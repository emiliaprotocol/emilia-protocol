name: 'Verify EMILIA Trust Receipt'
description: >-
  Offline-verify an EP-RECEIPT-v1 Trust Receipt in CI. Fails the build if the
  Ed25519 signature or Merkle anchor does not check out. Zero infrastructure,
  no API key — just the published @emilia-protocol/verify package and math.
author: 'EMILIA Protocol'
branding:
  icon: 'shield'
  color: 'yellow'

inputs:
  receipt:
    description: 'Path to the EP-RECEIPT-v1 JSON file to verify.'
    required: true
  public-key:
    description: >-
      Signer public key (base64url SPKI DER). If omitted, the action fetches the
      key set from keys-url and tries each key.
    required: false
    default: ''
  keys-url:
    description: 'URL of the EP key set. Used only when public-key is not provided.'
    required: false
    default: 'https://www.emiliaprotocol.ai/.well-known/ep-keys.json'
  version:
    description: 'Version of @emilia-protocol/verify to install.'
    required: false
    default: 'latest'

runs:
  using: 'composite'
  steps:
    # All ${{ }} values are routed through env vars and referenced as quoted
    # "$VARS" so untrusted input can never be injected into the shell.
    # Install into an isolated directory that has its own minimal package.json.
    # Running npm inside the action directory makes npm walk up to the
    # repository root package.json and resolve that whole dependency tree, which
    # fails with ETARGET while a coordinated release is still propagating.
    - name: Install verifier
      id: install
      shell: bash
      env:
        EP_ACTION_PATH: ${{ github.action_path }}
        EP_VERIFY_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        EP_VERIFY_DIR="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/ep-verify-receipt.XXXXXX")"
        printf '%s\n' '{"name":"ep-verify-receipt-runtime","private":true}' > "$EP_VERIFY_DIR/package.json"
        npm install --prefix "$EP_VERIFY_DIR" --no-save --no-package-lock --ignore-scripts \
          --no-audit --no-fund "@emilia-protocol/verify@$EP_VERIFY_VERSION"
        cp "$EP_ACTION_PATH/verify.mjs" "$EP_VERIFY_DIR/verify.mjs"
        echo "dir=$EP_VERIFY_DIR" >> "$GITHUB_OUTPUT"
    - name: Verify Trust Receipt
      shell: bash
      env:
        EP_VERIFY_DIR: ${{ steps.install.outputs.dir }}
        EP_RECEIPT: ${{ inputs.receipt }}
        EP_PUBLIC_KEY: ${{ inputs.public-key }}
        EP_KEYS_URL: ${{ inputs.keys-url }}
      run: node "$EP_VERIFY_DIR/verify.mjs"
