# Dependabot configuration
# Keeps GitHub Actions SHA pins up to date and bumps npm/pip dependencies.
#
# For GitHub Actions: Dependabot opens PRs that update the SHA pin and
# version comment whenever a new release is published. This gives both
# supply-chain security (exact SHA) and automated upgrade signal.
#
# Volume: every entry groups patch and minor version updates into one PR
# per run, and the subdirectory npm and pip entries run monthly. Groups use
# applies-to: version-updates, so security updates are unaffected and still
# open individually as soon as an advisory is published.

version: 2

updates:
  # ── GitHub Actions ─────────────────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      # One weekly PR for every non-major action bump (codeql, actions/*,
      # gitleaks, gradle, and the rest). Major bumps stay as standalone PRs
      # so a breaking action release gets its own review.
      actions-non-major:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "*"

  # ── npm (root workspace) ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Bundle patches/minors of unrelated dev tools into a single PR per
      # week. Frameworks (next, react, typescript) stay un-grouped so they
      # surface as standalone PRs that the auto-merge workflow can route
      # to human review.
      patch-and-minor-dev:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "react"
          - "react-dom"
          - "typescript"
          - "eslint"
          - "eslint-config-next"
          # Our own code uses the xmldom 0.9 line. Keep it out of this group so
          # each bump is a standalone PR: 0.9.x patches take the normal patch
          # auto-merge path, and a 0.x minor (0.10+) may break the API, so it
          # gets human review unless it closes a security advisory. node-saml,
          # xml-crypto, xml-encryption, and mammoth declare only ^0.8 and stay
          # on the nested 0.8.15 copies
          # pinned in package.json "overrides". Those pins are deliberate until
          # each consumer supports 0.9. They are exact, so a 0.8 LTS fix means
          # bumping them by hand.
          - "@xmldom/xmldom"
    ignore:
      # Avoid major version bumps on Next.js without a manual migration review
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sentry/nextjs"
        update-types: ["version-update:semver-major"]
      # ESLint 10 is not yet supported by the plugin versions resolved by
      # eslint-config-next 16.2.9. CI fails inside scope analysis, so hold the
      # major line until the upstream Next.js lint stack declares support.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # ── npm (MCP server) ────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      # Monthly runs on the first day of the month. This only paces routine
      # version updates; security updates are opened as soon as an advisory
      # lands, regardless of schedule, cooldown, or the PR limit.
      interval: monthly
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
      - mcp-server
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patches and minors in one PR per run; majors stay separate PRs.
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "*"

  # ── npm (TypeScript SDK) ────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /sdks/typescript
    schedule:
      # Monthly runs on the first day of the month. This only paces routine
      # version updates; security updates are opened as soon as an advisory
      # lands, regardless of schedule, cooldown, or the PR limit.
      interval: monthly
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
      - sdk
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patches and minors in one PR per run; majors stay separate PRs.
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "*"

  # ── npm (OpenShell approver receipts integration) ──────────────────────────
  - package-ecosystem: npm
    directory: /integrations/openshell-approver-receipts
    schedule:
      # Monthly runs on the first day of the month. This only paces routine
      # version updates; security updates are opened as soon as an advisory
      # lands, regardless of schedule, cooldown, or the PR limit.
      interval: monthly
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patches and minors in one PR per run; majors stay separate PRs.
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "*"

  # ── pip (Python SDK) ────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      # Monthly runs on the first day of the month. This only paces routine
      # version updates; security updates are opened as soon as an advisory
      # lands, regardless of schedule, cooldown, or the PR limit.
      interval: monthly
      time: "09:00"
      timezone: UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
      - sdk
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Patches and minors in one PR per run; majors stay separate PRs.
      patch-and-minor:
        applies-to: version-updates
        update-types:
          - patch
          - minor
        patterns:
          - "*"
