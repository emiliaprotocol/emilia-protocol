# SPDX-License-Identifier: Apache-2.0
name: AEB-1 Referee Self-Test
description: Run a checked-in language-neutral AEB-1 Referee command and upload its bounded SELF_TEST report.
branding:
  icon: shield
  color: blue

inputs:
  command-json:
    description: Non-secret JSON argv array recorded in the report; no shell is used.
    required: true
  checked-in-entrypoint:
    description: Caller-workspace-relative tracked non-symlink entrypoint that must be argv position 0 or 1.
    required: true
  executable-sha256:
    description: Runtime SHA-256 pin for the resolved argv[0] executable, formatted as sha256 plus lowercase hex.
    required: true
  report-path:
    description: Caller-workspace-relative path for the closed self-test report.
    required: false
    default: aeb-1-referee-report.json
  artifact-name:
    description: Name of the uploaded report artifact.
    required: false
    default: aeb-1-referee-self-test

outputs:
  assessment:
    description: Always SELF_TEST when the harness emitted a report.
    value: ${{ steps.referee.outputs.assessment }}
  report-path:
    description: Path to the generated report in the caller workspace.
    value: ${{ steps.referee.outputs.report-path }}

runs:
  using: composite
  steps:
    - id: referee
      name: Run bounded Referee intake
      shell: bash
      env:
        REFEREE_COMMAND_JSON: ${{ inputs.command-json }}
        REFEREE_ENTRYPOINT: ${{ inputs.checked-in-entrypoint }}
        REFEREE_EXECUTABLE_SHA256: ${{ inputs.executable-sha256 }}
        REFEREE_REPORT_PATH: ${{ inputs.report-path }}
      run: |
        set -u
        ACTION_ROOT=$(realpath -- "$GITHUB_ACTION_PATH/../../..")
        set +e
        OUTPUT=$(node "$ACTION_ROOT/scripts/run-referee-conformance.mjs" \
          --manifest "$ACTION_ROOT/conformance/referee/fixtures/manifest.json" \
          --workspace "$GITHUB_WORKSPACE" \
          --report-env REFEREE_REPORT_PATH \
          --command-env REFEREE_COMMAND_JSON \
          --entrypoint-env REFEREE_ENTRYPOINT \
          --executable-sha256-env REFEREE_EXECUTABLE_SHA256 \
          --require-checked-in-command \
          --report-must-be-in-workspace)
        STATUS=$?
        set -e
        if [ "$OUTPUT" != "SELF_TEST" ]; then
          echo "::error::AEB-1 Referee did not emit the required SELF_TEST marker."
          exit 2
        fi
        echo "$OUTPUT"
        echo "assessment=SELF_TEST" >> "$GITHUB_OUTPUT"
        echo "report-path=$REFEREE_REPORT_PATH" >> "$GITHUB_OUTPUT"
        exit "$STATUS"

    - name: Upload closed Referee report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-path }}
        if-no-files-found: error
        retention-days: 14
