name: CI

# Opt every JavaScript-based action into the Node.js 24 runner.
# GitHub forces this default in June 2026; doing it now eliminates the
# deprecation-warning noise on every run and surfaces any Node-24 incompat
# early. Affects actions/checkout, actions/setup-node, actions/upload-artifact, etc.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least privilege for the default GITHUB_TOKEN (otherwise write-all). No job in
# this workflow pushes commits, comments on PRs, or cuts releases — read is
# enough. A job that ever needs more must declare its own job-level permissions.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Required checks must also report on merge-queue candidates. Merge groups
  # always run the full lane (see the changes job).
  merge_group:
    types: [checks_requested]
  workflow_dispatch: # enables manual run; required for the gated e2e job

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 0: Change lane ───────────────────────────────────────────
  # Classifies a pull request as `docs` or `full` (scripts/ci/change-lane.mjs).
  # `docs` means every changed path is prose under docs/, standards/ or
  # papers/ (or a root *.md) AND no source that a docs-lane-skipped job runs
  # names a changed path or its directory. Jobs whose `if:` carries
  # `(github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs')`
  # are skipped for such pull requests; a job skipped by its own `if:`
  # reports success to branch protection. Every job that reads prose (test,
  # build, e2e, docker-build, lint, the typechecks, language governance and
  # proof statistics, preprint, docs consistency and secrets, protocol
  # discipline, conformance docs counts, secret scanning) still runs.
  #
  # The decision never trusts the pull request's own tooling:
  #   - a pull request that changes .github/ or scripts/ci/ is `full` before
  #     any classifier runs;
  #   - the classifier and its self-test are taken from the base commit (the
  #     merge commit's first parent), so an edit to the classifier is judged
  #     by the previous one;
  #   - `docs` also requires that main's latest push run of this workflow
  #     passed security-case, because the docs lane skips it here;
  #   - pushes, merge groups and manual runs, a missing base classifier, a
  #     failed self-test, a classifier error, an Actions API failure and an
  #     empty output all mean `full`, and every skippable job also runs
  #     `if: !cancelled()`, so a broken classifier can only make CI slower.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      lane: ${{ steps.classify.outputs.lane }}
      main_security_case: ${{ steps.classify.outputs.main_security_case }}
      main_security_case_run: ${{ steps.classify.outputs.main_security_case_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          # The pull_request merge commit and its first parent (the base).
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: github.event_name == 'pull_request'
        with:
          node-version: 24
      - name: Decide the lane with the base commit's classifier
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          classifier_log="$RUNNER_TEMP/change-lane.md"
          : > "$classifier_log"
          # Writes the step summary, then the outputs, the lane last: a
          # failure before that line leaves the lane empty, which is `full`.
          finish() {
            {
              # shellcheck disable=SC2016 # literal Markdown backticks
              printf '### CI lane: `%s`\n\n%s\n' "$1" "$2"
              if [[ -s "$classifier_log" ]]; then
                printf '\n<details><summary>Base classifier output</summary>\n\n'
                cat "$classifier_log"
                printf '\n</details>\n'
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [[ "$1" == docs ]]; then
              echo "main_security_case=success" >> "$GITHUB_OUTPUT"
              echo "main_security_case_run=$run_id" >> "$GITHUB_OUTPUT"
            fi
            echo "lane=$1" >> "$GITHUB_OUTPUT"
            exit 0
          }
          [[ "$EVENT_NAME" == pull_request ]] || finish full "Event \`$EVENT_NAME\` always runs the full lane."
          read -r -a merge <<< "$(git rev-list --parents -n 1 HEAD)"
          [[ ${#merge[@]} -eq 3 ]] || finish full "HEAD is not the pull request's two-parent merge commit."
          base="${merge[1]}"
          git diff --name-only -z --no-renames --no-ext-diff "$base" HEAD > "$RUNNER_TEMP/changed-paths"
          if grep -qzE '^(\.github|scripts/ci)/' "$RUNNER_TEMP/changed-paths"; then
            finish full "The pull request changes .github/ or scripts/ci/, which always runs the full lane."
          fi
          lane_dir="$RUNNER_TEMP/base-change-lane"
          mkdir -p "$lane_dir"
          for file in change-lane.mjs change-lane.node-test.mjs; do
            git show "$base:scripts/ci/$file" > "$lane_dir/$file" 2> /dev/null \
              || finish full "The base commit $base has no scripts/ci/$file."
          done
          env -u GITHUB_STEP_SUMMARY node --test "$lane_dir/change-lane.node-test.mjs"
          env -u GITHUB_STEP_SUMMARY node "$lane_dir/change-lane.mjs" \
            --event pull_request --github-output "$RUNNER_TEMP/lane.out" > "$classifier_log"
          cat "$classifier_log"
          candidate="$(cat "$RUNNER_TEMP/lane.out" 2> /dev/null || true)"
          [[ "$candidate" == lane=docs ]] || finish full "The base classifier chose \`${candidate#lane=}\`."
          # The docs lane skips security-case on this pull request, so it is
          # taken only while main's latest push run of ci.yml passed it.
          run_id="$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=1" \
            --jq '.workflow_runs[0].id // empty')" \
            || finish full "The Actions API did not answer, so main's security-case is unknown."
          [[ "$run_id" =~ ^[0-9]+$ ]] || finish full "No push run of ci.yml on main was found."
          conclusions="$(gh api --paginate "repos/$REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "security-case") | (.conclusion // .status)')" \
            || finish full "The Actions API did not answer, so main's security-case is unknown."
          conclusion="${conclusions%%$'\n'*}"
          [[ "$conclusion" == success ]] \
            || finish full "security-case on main's latest push run ($run_id) is \`${conclusion:-missing}\`, so this pull request runs it too."
          finish docs "Prose-only change; main's latest push run ($run_id) passed security-case."

  # ── Job 1: Tests — must pass 100% ────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run test suite with coverage (vitest)
        # A handful of individual tests spawn `node` as a subprocess to run a
        # script/example that imports from lib/ (now .ts; import specifiers
        # unchanged, per the bundler/NodeNext convention used repo-wide). This
        # step-scoped env (never $GITHUB_ENV, which GitHub blocks for
        # NODE_OPTIONS; never workflow/job-level, which would also apply to
        # actions/checkout before the repo exists) resolves that for just this
        # step's subprocesses. See scripts/ts-loader/README.md.
        env:
          NODE_OPTIONS: '--import ${{ github.workspace }}/scripts/ts-loader/register.mjs'
        run: npx vitest run --coverage
      - name: Verify package suites (node:test)
        # packages/verify and packages/issue ship zero-dependency standalone
        # suites on Node's built-in runner (excluded from vitest). The glob runs
        # EVERY packages/verify suite — quorum, revocation, time-attestation,
        # evidence-chain (AEC incl. relying-party requirement pinning),
        # federation, consistency, agent-binding, no-symmetric, CLI — plus the
        # Web Crypto equivalence suite (browser verifier proven byte-identical
        # to the audited Node build) and the issuer round-trip suite (a
        # locally-issued receipt proven to pass all seven §6.3 checks under
        # @emilia-protocol/verify). "issue locally, verify anywhere", enforced
        # every push. Do NOT go back to an explicit file list — that silently
        # dropped 8 of 11 suites from CI until 2026-07-02.
        # packages/require-receipt ships the shared makeReceiptGate reused by
        # packages/langchain, packages/openai-guard and packages/openai-agents.
        # Its suite ran in NO runner until 2026-07-19 (vitest collects zero
        # files under packages/), which is how the gate drifted out of the
        # missing_receipt_id contract that packages/gate redteam HI-5 and
        # app/api/v1/guarded both enforce. Keep it wired in.
        # packages/grpc-guard and packages/gateway-authz are the transport
        # adapters over that same gate. Their suites are the ONLY place the
        # "carried is not bound" property is executed per transport: a valid
        # receipt replayed against different request bytes, a different method,
        # or a different path must refuse. They are named here as well as
        # discovered by scripts/run-package-suites.mjs — the redundancy is
        # deliberate, because a receipt bound to nothing fails silently.
        # scripts/ci/ holds the CI lane classifier and the evidence autopilot
        # bundle tool; their suites prove the fail-closed lane decision and
        # the derived-evidence-only bundle.
        run: node --test packages/verify/test.js packages/verify/*.test.js packages/issue/test.js packages/issue/*.test.js packages/attest/test.js packages/require-receipt/*.test.js packages/grpc-guard/*.test.mjs packages/gateway-authz/*.test.mjs integrations/github-authority-map-action/tests/*.node-test.mjs integrations/github-merge-gate-action/tests/*.node-test.mjs scripts/ci/*.node-test.mjs
      - name: Verify AAE x PSEA x Gate attempt pair (node:test)
        run: node --test interop/aae-psea-gate/verify.test.mjs interop/aae-psea-gate/reperform.test.mjs
      - name: Verify the public verifier-forgery corpus (node:test)
        run: node --test tests/verifier-forgery/forgery.test.mjs
      - name: Verify every remaining package suite (discovered, not listed)
        # The step above still enumerates packages. That is the bug pattern that
        # dropped 8 of 11 verify suites until 2026-07-02 and left eight whole
        # packages (langchain, openai-guard, openai-agents, scan, ep-verify,
        # crash-test, fire-drill, fire-drill-mcp) in NO runner until 2026-07-19.
        # This step inverts the default: it DISCOVERS every packages/* that
        # declares a test script and runs the ones no other job covers, so a new
        # package is gated the moment it lands. Handing one off to another job
        # requires naming that job in COVERED_ELSEWHERE, and a stale handoff
        # fails the step instead of quietly shrinking coverage.
        run: node scripts/run-package-suites.mjs
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  # Crossing Lab refuses Node permission runtimes that cannot govern network
  # access. Keep its real adapter execution on a runtime exposing --allow-net;
  # the main Node 24 suite separately exercises the operational refusal path.
  crossing-lab-node26:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix examples/aeb-crossing-lab/insight-oracle-swap-v3 --ignore-scripts
      - name: Rebuild and verify the sealed Insight oracle-swap adapter
        run: |
          npm --prefix examples/aeb-crossing-lab/insight-oracle-swap-v3 run build
          git diff --exit-code -- \
            examples/aeb-crossing-lab/insight-oracle-swap-v3/adapter.mjs \
            examples/aeb-crossing-lab/insight-oracle-swap-v3/adapter.sha256 \
            examples/aeb-crossing-lab/insight-oracle-swap-v3/dependency-bundle.json
          npm --prefix examples/aeb-crossing-lab/insight-oracle-swap-v3 test
          node --test examples/aeb-crossing-lab/insight-oracle-swap-v3/aeb-contract-tests.test.mjs
      - name: Rebuild and run the permission-bounded Crossing Lab suite
        run: |
          npm --prefix packages/verify run build
          npm run check:standalone-runtimes
          node --test packages/verify/crossing-lab.test.js packages/verify/crossing-lab-cli.test.js

  # ── Job 1b: Consequence Firewall product + deployment ───────────
  gate-product-suite:
    # The release-image builder normally executes the governed security case,
    # conformance manifest, and proof-stat suite itself. In this workflow those
    # checks run in the SHA-identical security-case and
    # language-governance-checks jobs, so the builder takes the explicit
    # CI-only preverification flag instead of executing them twice. This suite
    # starts in the first minute, in parallel with them; the reuse is
    # discharged by the required `gate-product` job, which passes only when
    # security-case, language-governance and this suite all succeeded on the
    # same SHA. Nothing this job builds leaves the runner. Only the measured
    # test counts in lib/proof-stats.json may lag in CI (volatile-evidence
    # policy: advisory on pull requests, graced on main; every other field is
    # strict), so a CI image may carry lagging test counts. Releases stay
    # strict: consequence-control-deploy.yml builds
    # without the preverification flag, so its builder runs check:proof-stats,
    # and _publish-npm-package.yml runs check:proof-stats and check:llm-context.
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    env:
      TLA2TOOLS_JAR: ${{ github.workspace }}/tla2tools.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.4
      - run: npm ci --ignore-scripts
      - name: Verify public, private, pending, and archived migration history
        run: npm run check:migration-history
      - name: Gate the documented standalone example runs on minimum Node
        # receipt-program, authority-loop-v1, and agent-mailbox-v0.1 ship node:test suites that ran
        # in NO runner until 2026-08-07 (vitest excludes examples/**, and no job
        # listed them). Keep every examples/ demo suite named here or in a
        # dedicated step so a green CI actually means the demos run.
        run: |
          npm run check:standalone-runtimes
          node --test examples/action-escrow/scenario.test.mjs examples/action-escrow/standalone.test.mjs examples/receipt-program/demo.test.mjs examples/authority-loop-v1/demo.test.mjs examples/ot-command-binding-v1/scenario.test.mjs examples/self-modification-gate-v1/scenario.test.mjs examples/self-modification-gate-v1/run.test.mjs examples/bulk-power-action-assurance-v0.1/run.test.mjs examples/agent-mailbox-v0.1/demo.test.mjs
      # Runs the public Gate proof command on the repository's minimum Node
      # version. The command refuses stale compiled or standalone runtimes
      # before exercising allowance, indeterminate reconciliation, HTTP Gate,
      # control-to-actuator, and split-boundary behavior.
      - name: Run the Gate reference proof on minimum Node
        run: npm run proof:gate:reference
      - name: Verify the SYNC interoperability fixture and fail-closed chain boundary
        run: npm run test:sync-interop
      - name: Install the PostgreSQL client used by the live isolation test
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends postgresql-client shellcheck
      - name: Run the complete Gate package suite
        working-directory: packages/gate
        run: npm test
      - name: Run the carrier action-evidence pilot
        run: npm run test:carrier-action-pilot
      - name: Rebuild and refuse stale checked-in package runtimes
        run: |
          npm --prefix packages/verify run build
          npm --prefix packages/gate run build
          git diff --exit-code -- packages/verify/dist packages/gate/dist
      - name: Import every Verify and Gate export from packed tarballs
        run: npm run check:packed-package-exports
      - name: Run the hardened Gate service suite
        working-directory: apps/gate-service
        run: npm test
      - name: Run the consequence-control service suite
        working-directory: apps/consequence-control-service
        run: |
          npm ci --ignore-scripts
          npm test
      - name: Run the fail-closed Cloud Run deployment suite
        run: bash deploy/consequence-control-cloud-run/test.sh
      - name: Switch to the actuator's supported Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/consequence-actuator-service/package-lock.json
      - name: Run the credential-owning consequence-actuator service suite
        working-directory: apps/consequence-actuator-service
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run build -- --outDir "$RUNNER_TEMP/consequence-actuator-service-dist"
          npm test
      - name: Verify the SQL contract and live cross-tenant isolation
        env:
          POSTGRES_IMAGE: postgres@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        run: |
          bash packages/gate/deploy/sql/tests/contract-check.sh
          bash packages/gate/deploy/sql/tests/runtime-isolation.sh
      - name: Verify Helm charts
        run: |
          bash packages/gate/deploy/helm/emilia-gate/tests/render-check.sh
          bash packages/gate/deploy/helm/emilia-gate-service/tests/render-check.sh
      - name: Verify Terraform modules
        run: |
          bash packages/gate/deploy/terraform/tests/validate.sh
          bash packages/gate/deploy/terraform/service/tests/validate.sh
      - name: Verify the publishable package contents
        working-directory: packages/gate
        run: npm pack --dry-run --json
      - name: Remove ignored test state before release sealing
        run: |
          git clean -fdX -- \
            apps/consequence-actuator-service \
            apps/consequence-control-service \
            apps/gate-service \
            caid \
            packages/gate \
            packages/require-receipt \
            packages/verify
      - name: Download pinned TLC model checker for governed image inputs
        env:
          TLA_VERSION: v1.7.4
          TLA_ASSET_ID: '184694200'
          TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/download-tla2tools.sh "$TLA2TOOLS_JAR"
      - name: Build all production images from the governed release inputs
        run: |
          deploy/consequence-control-cloud-run/build-release-images.sh \
            --ci \
            --governed-evidence-preverified \
            --expected-commit "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/consequence-control-release-ci"
      - name: Import-smoke the consequence-control image
        run: |
          docker run --rm emilia-consequence-control:ci \
            sh -c 'node --test /app/apps/consequence-control-service/test/*.test.js'
          docker run --rm emilia-consequence-control:ci \
            node --input-type=module --eval \
            "await import('/app/apps/consequence-control-service/src/production-config.js'); await import('/app/apps/consequence-control-service/src/server.js');"
      - name: Import-smoke the credential-owning actuator image
        run: |
          docker run --rm emilia-consequence-actuator:ci \
            node --input-type=module --eval \
            "await import('/app/apps/consequence-actuator-service/dist/production-config.js'); await import('/app/apps/consequence-actuator-service/dist/server.js');"
      - name: Refuse high or critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: emilia-gate-service:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
      - name: Refuse high or critical consequence-control vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: emilia-consequence-control:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true
      - name: Refuse high or critical consequence-actuator vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          image-ref: emilia-consequence-actuator:ci
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
          hide-progress: true

  # ── Job 1c (required check): Gate product ──────────────────────
  # Discharges the preverified release seal in gate-product-suite: passes only
  # when security-case, language-governance and gate-product-suite succeeded
  # on this SHA (full lane), or, on a pull_request run the changes job put in
  # the prose-only docs lane after seeing main's latest push run pass
  # security-case, when the skipped jobs were skipped and language governance
  # still succeeded. Any other combination takes the full-lane branch.
  gate-product:
    needs: [changes, security-case, language-governance, gate-product-suite]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept the preverified release seal only after its governed inputs pass
        env:
          EVENT_NAME: ${{ github.event_name }}
          LANE: ${{ needs.changes.outputs.lane }}
          MAIN_SECURITY_CASE: ${{ needs.changes.outputs.main_security_case }}
          MAIN_SECURITY_CASE_RUN: ${{ needs.changes.outputs.main_security_case_run }}
          SECURITY_CASE: ${{ needs.security-case.result }}
          LANGUAGE_GOVERNANCE: ${{ needs.language-governance.result }}
          SUITE: ${{ needs.gate-product-suite.result }}
        run: |
          set -euo pipefail
          [[ "$LANGUAGE_GOVERNANCE" == success ]] || {
            echo "::error::language-governance did not succeed: $LANGUAGE_GOVERNANCE"
            exit 1
          }
          if [[ "$EVENT_NAME" == pull_request && "$LANE" == docs && "$MAIN_SECURITY_CASE" == success \
            && "$MAIN_SECURITY_CASE_RUN" =~ ^[0-9]+$ ]]; then
            for result in "$SECURITY_CASE" "$SUITE"; do
              [[ "$result" == skipped || "$result" == success ]] || {
                echo "::error::docs lane dependency did not pass: $result"
                exit 1
              }
            done
            echo "Prose-only change: security-case and gate-product-suite inputs are unchanged; main's push run $MAIN_SECURITY_CASE_RUN passed security-case."
          else
            [[ "$SECURITY_CASE" == success ]] || {
              echo "::error::security-case did not succeed: $SECURITY_CASE"
              exit 1
            }
            [[ "$SUITE" == success ]] || {
              echo "::error::gate-product-suite did not succeed: $SUITE"
              exit 1
            }
          fi
          echo '"gate-product" is satisfied.'

  # ── Job 2: Build — Next.js production build must succeed ─────────
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Next.js production build
        run: npm run build

  # ── Job 2c: Security-core type gate (tsc --checkJs, zero errors) ─
  # The security core (packages/verify, lib/handshake, packages/gate) is kept
  # clean under `tsc -p tsconfig.core.json` (allowJs + checkJs, JSDoc types
  # only). This job fails on ANY type error so the core stays typed as it
  # evolves. It is types-only: `noEmit` is set, so it never produces output
  # and never affects runtime behavior. typescript is pinned in devDependencies.
  typecheck-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type-check the security core (checkJs)
        run: npx tsc -p tsconfig.core.json --incremental false

  # ── Job 2d: lib/ type gate (tsc --checkJs, zero errors) ──────────
  # The full lib/ tree is kept clean under `tsc -p tsconfig.lib.json`
  # (allowJs + checkJs, JSDoc types only — mirrors typecheck-core above).
  # This job fails on ANY type error so lib/ stays typed as it evolves. It
  # is types-only: `noEmit` is set, so it never produces output and never
  # affects runtime behavior. typescript is pinned in devDependencies.
  typecheck-lib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type-check lib/ (checkJs)
        run: npx tsc -p tsconfig.lib.json --incremental false

  # ── Job 2e: backend/tooling type gate (tsc --checkJs, zero errors) ──
  # scripts/, examples/, conformance/, mcp-server/, and packages/{mcp-guard,
  # require-receipt,langchain,openai-guard,mobile} are kept clean under
  # `tsc -p tsconfig.rest.json` (allowJs + checkJs, JSDoc types only —
  # mirrors typecheck-core/typecheck-lib above). This job fails on ANY type
  # error so this tier stays typed as it evolves. It is types-only: `noEmit`
  # is set, so it never produces output and never affects runtime behavior.
  # typescript is pinned in devDependencies.
  typecheck-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix examples/aeb-crossing-lab/insight-oracle-swap-v3 --ignore-scripts
      - name: Type-check backend/tooling tier (checkJs)
        run: npx tsc -p tsconfig.rest.json --incremental false

  # ── Job 2f: app/ type gate (tsc --checkJs, zero errors) ──────────
  # The React/Next tier (app/**) is kept clean under `tsc -p tsconfig.app.json`
  # (allowJs + checkJs, JSX preserved, JSDoc types only — mirrors
  # typecheck-core/typecheck-lib/typecheck-rest above). This job fails on ANY
  # type error so app/ stays typed as it evolves. It is types-only: `noEmit`
  # is set, so it never produces output and never affects runtime behavior.
  # typescript is pinned in devDependencies.
  typecheck-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Type-check app/ (checkJs)
        run: npx tsc -p tsconfig.app.json --incremental false

  # ── Job 2g: remaining production compiler surfaces ───────────────
  # The secure mobile app has its own dependency graph. Declaration files and
  # the public TypeScript SDK use strict TypeScript. Together with the four
  # checkJs jobs above, this closes every production implementation surface;
  # only test-runner/linter/mutation-test configuration files are intentionally
  # excluded from the production compiler programs.
  typecheck-production-surfaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix apps/secure-app --ignore-scripts
      - name: Type-check secure app, declarations, and TypeScript SDK
        run: |
          npm run typecheck:secure-app
          npm run typecheck:declarations
          npm run typecheck:sdk

  # ── Job 2b: Continuous adversarial fuzzing (audit GAP 7) ─────────
  # A seeded, deterministic property fuzzer for the concurrency-sensitive
  # surfaces. The async-guard bypass was a parallel-consumption race; this
  # bounded fixed-seed batch drives many interleaved reserve/commit and
  # consume-once attempts against the REAL capability and consumption stores
  # every push and asserts the safety invariants. A regression fails at a named
  # seed the author can replay locally. The deeper nightly sweep is documented
  # in fuzz/README.md. The batch itself makes no network calls. The real Gate
  # runtime now imports the repository-local Verify SDK for algorithm-agile
  # signatures, so install the locked root graph before executing it.
  fuzz:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run the bounded fixed-seed fuzz batch (<60s)
        run: node fuzz/ci-batch.mjs

  # ── Job 2c: Witness equivocation proof ───────────────────────────
  # Starts three real witness HTTP servers, proves an honest 2-of-3 quorum,
  # then presents two quorum-backed roots at the same tree size and requires
  # cross-view gossip to identify the split view. This continuously proves the
  # deploy-kit mechanism; independent administration remains an external
  # operational property and is not claimed by this in-process test.
  witness-equivocation:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Prove quorum and gossip equivocation detection
        run: node --test witness/deploy/equivocation.node-test.mjs

  # ── Job 2d: Preprint evidence synchronization ────────────────────
  # The paper is not published by CI. This checks the declared source
  # fingerprints and evidence-bearing claims in source and rendered PDF.
  # Full TeX -> PDF derivation is separately reproducible with preprint:build.
  preprint-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install the PDF text extractor used by the evidence checker
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Verify source, PDF, standards, conformance, and proof evidence agree
        run: npm run check:preprint
      - name: Exercise preprint drift refusals
        run: npm run test:preprint

  # ── Job 3: Write discipline ──────────────────────────────────────
  write-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check write discipline
        run: node scripts/check-write-discipline.js

  # ── Job 4: Exact, content-addressed security case ────────────────
  security-case:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    env:
      TLA2TOOLS_JAR: ${{ github.workspace }}/tla2tools.jar
    # id-token and attestations serve only the attest steps, which run on
    # push and manual runs. The job keeps them while merge-queue candidate
    # code runs, so a candidate could mint its own GitHub attestation with
    # source ref refs/heads/gh-readonly-queue/main/...; anyone verifying
    # these attestations must pin --source-ref refs/heads/main and this
    # workflow as the signer.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Must match the npm publication workflows: the security case binds
          # the exact tarball bytes produced by this runtime.
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
      - run: python -m pip install --require-hashes -r .github/workflow-requirements/cryptography.txt
      - run: npm ci --ignore-scripts
      - name: Prove generated Node 20 runtimes match their TypeScript sources
        run: npm run check:standalone-runtimes
      - name: Download pinned TLC model checker
        env:
          TLA_VERSION: v1.7.4
          TLA_ASSET_ID: '184694200'
          TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/download-tla2tools.sh tla2tools.jar
      - name: Execute exact claims and require the checked-in security case to be current
        env:
          # Every claim's implementations[] entry is dynamically import()ed to
          # confirm the named export is real and callable. packages/gate/src
          # and lib/ files import siblings by .js specifier per this repo's
          # renamed-in-place convention, so this step needs the same loader
          # hook the other steps in this job already have.
          NODE_OPTIONS: '--import ${{ github.workspace }}/scripts/ts-loader/register.mjs'
        run: npm run check:security-case
      - name: Replay bounded formal traces against runtime behavior
        env:
          NODE_OPTIONS: '--import ${{ github.workspace }}/scripts/ts-loader/register.mjs'
        run: npm run check:formal-traces
      - name: Verify bounded-execution reference vectors are byte-current
        run: npm run check:bounded-execution-artifacts
      - name: Run deterministic cross-language hostile corpus
        env:
          NODE_OPTIONS: '--import ${{ github.workspace }}/scripts/ts-loader/register.mjs'
        run: npm run conformance:hostility
      - name: Run hostility against every live conformance suite
        env:
          NODE_OPTIONS: '--import ${{ github.workspace }}/scripts/ts-loader/register.mjs'
        run: npm run conformance:hostility:current
      - name: Run Model-to-Matter executor profile vectors
        env:
          NODE_OPTIONS: '--import ${{ github.workspace }}/scripts/ts-loader/register.mjs'
        run: npm run m2m:conformance
      - name: Exercise external implementation intake protocol
        run: npm run conformance:clean-room:contract
      - name: Require the checked-in cross-language conformance manifest to be current
        env:
          NODE_OPTIONS: '--import ${{ github.workspace }}/scripts/ts-loader/register.mjs'
        run: npm run conformance:manifest:check
      - name: Verify exact frozen clean-room evidence baseline
        run: npm run conformance:manifest:clean-room
      - name: Attest exact security case on protected-branch runs
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: security/security-case.json
      - name: Attest exact conformance manifest on protected-branch runs
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: conformance/conformance-manifest.json
      - name: Attest exact frozen clean-room manifest on protected-branch runs
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: conformance/clean-room/conformance-manifest.v1.json
      - name: Upload resolved security and conformance cases
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-and-conformance-case
          path: |
            security/security-case.json
            conformance/conformance-manifest.json
            conformance/clean-room/conformance-manifest.v1.json
          retention-days: 90

  # ── Job 5: Language governance ───────────────────────────────────
  language-governance-checks:
    # Proof-stat measurement consumes the checked-in security-case data for
    # this exact SHA (--security-case-preverified) instead of executing that
    # seven-minute case a second time. It starts in the first minute, in
    # parallel with security-case; the required `language-governance` job
    # below accepts its result only after security-case succeeded on the same
    # SHA. Every step here reads prose, so the docs lane keeps this job.
    #
    # Volatile evidence (scripts/ci/volatile-evidence.mjs): lib/proof-stats.json
    # and the four LLM context artifacts are regenerated on main by
    # volatile-evidence-refresh.yml. Deny by default: only drift in the
    # measured test counts (tests.total, tests.files) may lag. The two checks
    # below fail on every other drift themselves (any other proof field, any
    # stale LLM context file) and record the rest in drift reports, and the
    # policy step checks them again and turns test-count drift into a verdict:
    # advisory on pull_request and merge_group (a pull request that changes
    # lib/proof-stats.json must keep the base's counts and generatedAt or make
    # them exact); strict on main's own refresh pull request, which also fails
    # on any changed path outside the five files; and on main a failure once
    # the drift is older than the grace window. Everything else the checks
    # verify (a passing measured suite, the security case, formal and
    # conformance evidence, every generator assertion) still fails the job.
    # The security case, formal traces, conformance manifest and clean-room
    # pins stay strict in the security-case job.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The policy step dates stale evidence on main from the refresh
      # workflow's runs and jobs.
      actions: read
    env:
      TLA2TOOLS_JAR: ${{ github.workspace }}/tla2tools.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent: the policy step diffs them
          # to find what a pull request changes itself.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # check:proof-stats executes the full suite, including scripts whose
          # .js specifiers resolve to migrated .ts sources. The repo loader
          # requires Node's built-in TypeScript stripping (Node >=22.6).
          node-version: 24
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --ignore-scripts
      - name: Download pinned TLC model checker
        env:
          TLA_VERSION: v1.7.4
          TLA_ASSET_ID: '184694200'
          TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/download-tla2tools.sh tla2tools.jar
      - name: Rebuild governed TypeScript runtimes and refuse drift
        run: |
          npm run build:ts-runtime
          git diff --exit-code
      - name: Check language governance
        run: node scripts/check-language-governance.js
      - name: Check public conformance claims against the current manifest
        run: npm run check:public-conformance-claims
      - name: Measure proof statistics and report volatile drift
        env:
          SECURITY_CASE_PREVERIFIED_SHA: ${{ github.sha }}
          # generate-proof-stats.mjs runs the full vitest suite, and
          # tests/grace-curtailment.test.ts execFileSync-spawns
          # examples/grace/proof-of-curtailment-vector.mjs as a bare `node`
          # child process. Vitest's own transform pipeline covers everything
          # it loads directly, but not that grandchild subprocess, which
          # still needs the loader hook to resolve .js specifiers renamed to
          # .ts during the migration.
          NODE_OPTIONS: '--import ${{ github.workspace }}/scripts/ts-loader/register.mjs'
        run: npm run check:proof-stats -- --security-case-preverified --drift-report "$RUNNER_TEMP/proof-stats-drift.json"
      - name: Check generated LLM context against its inputs
        run: npm run check:llm-context -- --drift-report "$RUNNER_TEMP/llm-context-drift.json"
      - name: Apply the volatile evidence policy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: >-
          node scripts/ci/volatile-evidence.mjs policy
          --report "$RUNNER_TEMP/proof-stats-drift.json"
          --report "$RUNNER_TEMP/llm-context-drift.json"
          --event "$EVENT_NAME"
          --ref "$GITHUB_REF"
          --head-ref "$HEAD_REF"
          --touched-base HEAD^1
          --sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"
      - name: Check standards observatory snapshot freshness
        run: npm run observatory:check

  # ── Job 5b (required check): Language governance ────────────────
  # Discharges --security-case-preverified in language-governance-checks:
  # passes only when those checks succeeded and security-case succeeded on
  # this SHA, or, on a pull_request run the changes job put in the docs lane
  # after seeing main's latest push run pass security-case, when the security
  # case was skipped. Any other combination takes the full-lane branch.
  language-governance:
    needs: [changes, security-case, language-governance-checks]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Accept preverified proof statistics only after the security case passes
        env:
          EVENT_NAME: ${{ github.event_name }}
          LANE: ${{ needs.changes.outputs.lane }}
          MAIN_SECURITY_CASE: ${{ needs.changes.outputs.main_security_case }}
          MAIN_SECURITY_CASE_RUN: ${{ needs.changes.outputs.main_security_case_run }}
          SECURITY_CASE: ${{ needs.security-case.result }}
          CHECKS: ${{ needs.language-governance-checks.result }}
        run: |
          set -euo pipefail
          [[ "$CHECKS" == success ]] || {
            echo "::error::language-governance-checks did not succeed: $CHECKS"
            exit 1
          }
          if [[ "$EVENT_NAME" == pull_request && "$LANE" == docs && "$MAIN_SECURITY_CASE" == success \
            && "$MAIN_SECURITY_CASE_RUN" =~ ^[0-9]+$ ]]; then
            [[ "$SECURITY_CASE" == skipped || "$SECURITY_CASE" == success ]] || {
              echo "::error::security-case did not pass: $SECURITY_CASE"
              exit 1
            }
            echo "Prose-only change: security-case inputs are unchanged; main's push run $MAIN_SECURITY_CASE_RUN passed security-case."
          else
            [[ "$SECURITY_CASE" == success ]] || {
              echo "::error::security-case did not succeed: $SECURITY_CASE"
              exit 1
            }
          fi
          echo '"language-governance" is satisfied.'

  # ── Job 6a: License headers ──────────────────────────────────────
  license-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Check license headers
        run: node scripts/check-license-headers.js

  # ── Job 5b: Demo key isolation ──────────────────────────────────
  # Guard the hardcoded /r/example demo Ed25519 private key against
  # copy-paste leakage into production code paths.
  demo-key-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Check demo key isolation
        run: node scripts/check-demo-key-isolation.js

  # ── Job 5c: Air-gap artifact audit ──────────────────────────────
  # Static self-containment audit (no Docker) + proof that EP receipt
  # verification runs with zero network. The full containerized no-egress
  # run is operator-side / workflow_dispatch (see deploy/airgap/README.md).
  airgap-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Air-gap self-containment audit
        run: bash deploy/airgap/audit.sh
      - name: Offline verification proof
        run: bash deploy/airgap/verify-offline.sh

  # ── Job 5d: Secure App signoff round-trip ───────────────────────
  # Proves the native Secure App produces a Class-A signoff that verifies
  # offline under @emilia-protocol/verify. Needs no install (node + repo only).
  secure-app-signoff:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Secure App signoff verifies under @emilia-protocol/verify
        run: node --test apps/secure-app/lib/ep-signoff.test.mjs

  # ── Job 7: Lint — Next.js lint must pass or warn only ────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run ESLint
        # `next lint` is deprecated in Next.js 16 and breaks with a
        # circular-structure error under eslint-config-next v16+. The repo
        # already uses flat config (eslint.config.mjs), so invoke ESLint
        # directly. No --max-warnings=0 because `next lint` didn't enforce
        # that and adding it now would surface 8 pre-existing default-export
        # warnings as CI failures (separate cleanup task).
        run: npx eslint .

  # ── Job 8: Protocol discipline — trust-model violation guardrails
  protocol-discipline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run protocol discipline checks
        run: node scripts/check-protocol-discipline.js

      - name: Admissibility invariant registry (every claim maps to code, negative vector, parity, pinned acceptance)
        run: node scripts/check-admissibility-registry.mjs

      - name: Authority-claim guard (no public "authority enforced"/"scoped authority" claim without registry entry + passing vectors)
        run: node scripts/check-authority-claims.mjs

      - name: No direct receipt inserts outside canonical path
        run: |
          hits=$(grep -rn "\.from('receipts')\.insert\|\.from(\"receipts\")\.insert" app/ lib/ mcp-server/ --include='*.js' --include='*.mjs' --include='*.ts' --include='*.tsx' --include='*.mts' | grep -v "lib/create-receipt\.\(js\|ts\)" | grep -v "lib/canonical-writer\.\(js\|ts\)" || true)
          if [ -n "$hits" ]; then
            echo "::error::Direct receipt inserts found outside canonical path:"
            echo "$hits"
            exit 1
          fi
          echo "OK — no direct receipt inserts outside canonical path."

      - name: No raw EP_ env reads outside lib/env.js (or allowlisted files)
        run: |
          # Allowlist matches the constants in scripts/check-protocol-discipline.js:ENV_ALLOWLIST.
          # Keep these in sync; the CI grep is the authoritative gate.
          #   lib/env.js              — the canonical env accessor (by definition)
          #   lib/operator-auth.js    — reads EP_OPERATOR_KEYS at module init;
          #                             refactor to env.js TODO'd in the script
          hits=$(grep -rn "process\.env\.EP_" lib/ app/ --include='*.js' --include='*.mjs' --include='*.ts' --include='*.tsx' --include='*.mts' \
            | grep -v "lib/env\.\(js\|ts\)" \
            | grep -v "lib/operator-auth\.\(js\|ts\)" \
            || true)
          if [ -n "$hits" ]; then
            echo "::error::Raw process.env.EP_ reads found outside lib/env.js (and allowlist):"
            echo "$hits"
            exit 1
          fi
          echo "OK — no raw EP_ env reads outside lib/env.js."

  # ── Job 9: MCP server packaging smoke test ───────────────────────
  mcp-server-pack:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies against the local unreleased verifier
        run: |
          npm ci --ignore-scripts
          npm pack ./packages/verify --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/verify-pack.json"
          VERIFY_TARBALL=$(node -e "const r=require(process.argv[1]); if(r.length!==1) process.exit(2); process.stdout.write(r[0].filename)" "$RUNNER_TEMP/verify-pack.json")
          cp mcp-server/package.json "$RUNNER_TEMP/mcp-server-package.json"
          cp mcp-server/package-lock.json "$RUNNER_TEMP/mcp-server-package-lock.json"
          cd mcp-server
          npm install --ignore-scripts --save-exact "$RUNNER_TEMP/$VERIFY_TARBALL"
          npm ci --ignore-scripts
      - name: Verify npm pack succeeds
        working-directory: mcp-server
        run: |
          npm run build
          git diff --exit-code -- bundle.js
          cp "$RUNNER_TEMP/mcp-server-package.json" package.json
          cp "$RUNNER_TEMP/mcp-server-package-lock.json" package-lock.json
          npm pack
      - name: Smoke test — verify entry point loads
        working-directory: mcp-server
        run: node -e "import('./bundle.js').then(() => console.log('MCP server entry OK'))"

  # ── Job 9b: Benchmark gate — performance regression check ────────
  benchmark:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run benchmark tests
        run: npx vitest run tests/benchmark.test.ts tests/adversarial-benchmarks.test.ts
        env:
          BENCHMARK_CI: '1'

  # ── Job 10: TypeScript SDK ───────────────────────────────────────
  sdk-typescript:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Vitest 5 declares node ^22.12.0 || ^24 || >=26 for the dev lane.
          node-version: 22
      - name: Install dependencies
        working-directory: sdks/typescript
        # Committed package-lock.json → deterministic install (scripts disabled).
        run: npm ci --ignore-scripts
      - name: Build SDK
        working-directory: sdks/typescript
        run: npm run build
      - name: Type-check
        working-directory: sdks/typescript
        run: npx tsc --noEmit
      - name: Run tests
        working-directory: sdks/typescript
        run: npm test

  # The SDK advertises Node >=18, while Vitest 5 intentionally requires Node
  # 22.12+. Prove the consumer/runtime floor against the built package without
  # weakening the normal Node 22 build, type-check, and unit-test lane above.
  sdk-typescript-node18-runtime:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 18.20.8
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - name: Install the locked SDK build graph
        working-directory: sdks/typescript
        run: npm ci --ignore-scripts
      - name: Build, pack, and smoke-test the installed SDK
        working-directory: sdks/typescript
        shell: bash
        run: |
          npm run build
          consumer_dir="$RUNNER_TEMP/emilia-sdk-node18-consumer"
          mkdir -p "$consumer_dir"
          npm pack --pack-destination "$consumer_dir"
          shopt -s nullglob
          tarballs=("$consumer_dir"/emilia-protocol-sdk-*.tgz)
          test "${#tarballs[@]}" -eq 1
          cd "$consumer_dir"
          npm init --yes >/dev/null
          npm install --ignore-scripts --no-audit --no-fund "${tarballs[0]}"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import path from 'node:path';
          import { EPClient } from '@emilia-protocol/sdk';

          assert.match(process.version, /^v18\./);
          const packageMetadata = JSON.parse(
            await readFile(
              path.join(
                process.cwd(),
                'node_modules',
                '@emilia-protocol',
                'sdk',
                'package.json',
              ),
              'utf8',
            ),
          );

          const observed = {};
          const fetchImpl = async (url, options) => {
            observed.url = String(url);
            observed.method = options.method;
            observed.headers = options.headers;
            return new Response(JSON.stringify({ status: 'ok' }), {
              status: 200,
              headers: { 'content-type': 'application/json' },
            });
          };

          const client = new EPClient({
            baseUrl: 'https://example.invalid/',
            fetchImpl,
          });
          const result = await client.health();

          assert.equal(result.status, 'ok');
          assert.equal(observed.url, 'https://example.invalid/api/health');
          assert.equal(observed.method, 'GET');
          assert.equal(
            observed.headers['User-Agent'],
            `@emilia-protocol/sdk/${packageMetadata.version}`,
          );
          NODE

  # ── Job 11: Python SDK ──────────────────────────────────────────
  sdk-python:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Build the Python SDK wheel
        run: |
          python -m pip wheel --no-deps \
            --wheel-dir "$RUNNER_TEMP/python-sdk-dist" \
            sdks/python
          WHEEL_COUNT=$(find "$RUNNER_TEMP/python-sdk-dist" -maxdepth 1 -name 'emilia_protocol-*.whl' | wc -l)
          test "$WHEEL_COUNT" -eq 1
      - name: Install the exact wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/python-sdk-venv"
          "$RUNNER_TEMP/python-sdk-venv/bin/python" -m pip install \
            --no-deps "$RUNNER_TEMP"/python-sdk-dist/emilia_protocol-*.whl
      - name: Test the installed wheel
        env:
          EMILIA_SDK_WHEEL_TEST: '1'
        run: |
          "$RUNNER_TEMP/python-sdk-venv/bin/python" -m unittest discover \
            -s sdks/python/tests -v

  # ── Job 11a: Installed PyPI wheels across declared Python floors ──
  # Every public Python distribution is built as a wheel and tested from an
  # isolated staging tree. The package source is deliberately absent from that
  # tree, so an import can only succeed through the installed wheel.
  pypi-installed-wheels:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    name: PyPI wheel ${{ matrix.distribution }} (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - distribution: emilia-protocol
            python: '3.10'
            path: sdks/python
            tests: sdks/python/tests
            wheel_glob: emilia_protocol-*.whl
            import_module: emilia_protocol
          - distribution: emilia-protocol
            python: '3.12'
            path: sdks/python
            tests: sdks/python/tests
            wheel_glob: emilia_protocol-*.whl
            import_module: emilia_protocol
          - distribution: emilia-verify
            python: '3.10'
            path: packages/python-verify
            tests: packages/python-verify/tests
            wheel_glob: emilia_verify-*.whl
            import_module: emilia_verify
          - distribution: emilia-verify
            python: '3.12'
            path: packages/python-verify
            tests: packages/python-verify/tests
            wheel_glob: emilia_verify-*.whl
            import_module: emilia_verify
          - distribution: emilia-crewai
            python: '3.10'
            path: packages/crewai
            tests: packages/crewai/tests
            wheel_glob: emilia_crewai-*.whl
            import_module: emilia_crewai
          - distribution: emilia-crewai
            python: '3.12'
            path: packages/crewai
            tests: packages/crewai/tests
            wheel_glob: emilia_crewai-*.whl
            import_module: emilia_crewai
          - distribution: ep-verify
            python: '3.10'
            path: packages/ep-verify-py
            tests: packages/ep-verify-py/tests
            wheel_glob: ep_verify-*.whl
            import_module: ep_verify
          - distribution: ep-verify
            python: '3.12'
            path: packages/ep-verify-py
            tests: packages/ep-verify-py/tests
            wheel_glob: ep_verify-*.whl
            import_module: ep_verify
          - distribution: langchain-emilia
            python: '3.10'
            path: integrations/langchain-emilia
            tests: integrations/langchain-emilia/tests
            wheel_glob: langchain_emilia-*.whl
            import_module: langchain_emilia
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Build release wheel
        env:
          PACKAGE_PATH: ${{ matrix.path }}
          WHEEL_GLOB: ${{ matrix.wheel_glob }}
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/pypi-dist"
          mkdir -p "$DIST"
          python -m pip wheel --no-deps --wheel-dir "$DIST" "$PACKAGE_PATH"
          WHEEL_COUNT=$(find "$DIST" -maxdepth 1 -name "$WHEEL_GLOB" | wc -l)
          test "$WHEEL_COUNT" -eq 1
      - name: Install exact wheel in a clean environment
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          PYTHON_VERSION: ${{ matrix.python }}
          WHEEL_GLOB: ${{ matrix.wheel_glob }}
        run: |
          set -euo pipefail
          DIST="$RUNNER_TEMP/pypi-dist"
          VENV="$RUNNER_TEMP/pypi-wheel-venv"
          python -m venv "$VENV"

          if [[ "$PYTHON_VERSION" == "3.10" ]]; then
            REQUIREMENTS=.github/workflow-requirements/pypi-wheel-test.txt
          else
            REQUIREMENTS=.github/workflow-requirements/release.txt
          fi
          "$VENV/bin/python" -m pip install \
            --require-hashes \
            -r "$REQUIREMENTS"

          # Test the thin adapters against emilia-verify from this checkout,
          # not whichever build happens to be live on PyPI.
          if [[ "$DISTRIBUTION" == "emilia-crewai" || "$DISTRIBUTION" == "ep-verify" ]]; then
            python -m pip wheel --no-deps \
              --wheel-dir "$DIST" packages/python-verify
            "$VENV/bin/python" -m pip install \
              --no-deps "$DIST"/emilia_verify-*.whl
          fi

          TARGET_WHEEL=$(find "$DIST" -maxdepth 1 -name "$WHEEL_GLOB" -print -quit)
          "$VENV/bin/python" -m pip install --no-deps "$TARGET_WHEEL"
      - name: Stage tests without package source
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          TESTS_PATH: ${{ matrix.tests }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/pypi-wheel-tests"
          mkdir -p "$STAGE/$(dirname "$TESTS_PATH")"
          cp -R "$GITHUB_WORKSPACE/$TESTS_PATH" "$STAGE/$TESTS_PATH"

          # Preserve only non-package fixtures referenced by the real suites.
          if [[ "$DISTRIBUTION" == "emilia-verify" ]]; then
            mkdir -p "$STAGE/conformance"
            cp -R "$GITHUB_WORKSPACE/conformance/vectors" "$STAGE/conformance/vectors"
          elif [[ "$DISTRIBUTION" == "emilia-protocol" ]]; then
            mkdir -p "$STAGE/sdks/python" "$STAGE/docs/api" \
              "$STAGE/app/api" "$STAGE/app/api/trust" "$STAGE/app/api/v1/signoffs"
            cp "$GITHUB_WORKSPACE/sdks/python/route-contract.json" "$STAGE/sdks/python/"
            cp "$GITHUB_WORKSPACE/openapi.yaml" "$STAGE/"
            cp "$GITHUB_WORKSPACE/docs/api/govguard-v1.yaml" "$STAGE/docs/api/"
            cp -R "$GITHUB_WORKSPACE/app/api/handshake" "$STAGE/app/api/handshake"
            cp -R "$GITHUB_WORKSPACE/app/api/trust/gate" "$STAGE/app/api/trust/gate"
            cp -R "$GITHUB_WORKSPACE/app/api/v1/signoffs/request" "$STAGE/app/api/v1/signoffs/request"
            mkdir -p "$STAGE/app/api/v1"
            cp -R "$GITHUB_WORKSPACE/app/api/v1/trust-receipts" "$STAGE/app/api/v1/trust-receipts"
          fi
      - name: Prove import origin and run installed-wheel tests
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          IMPORT_MODULE: ${{ matrix.import_module }}
          TESTS_PATH: ${{ matrix.tests }}
          EMILIA_SDK_WHEEL_TEST: '1'
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/pypi-wheel-tests"
          VENV="$RUNNER_TEMP/pypi-wheel-venv"
          MODULE_FILE=$(cd "$STAGE" && "$VENV/bin/python" -c \
            'import importlib, os; print(importlib.import_module(os.environ["IMPORT_MODULE"]).__file__)')
          case "$MODULE_FILE" in
            "$GITHUB_WORKSPACE"/*|"$STAGE"/*)
              echo "Package import escaped the installed wheel: $MODULE_FILE" >&2
              exit 1
              ;;
          esac
          cd "$STAGE"
          "$VENV/bin/python" -m pytest -q --import-mode=importlib "$TESTS_PATH"
          "$VENV/bin/python" -c \
            'import importlib.metadata, os; print(os.environ["DISTRIBUTION"], importlib.metadata.version(os.environ["DISTRIBUTION"]))'

  # ── Job 11b: Cross-language conformance ──────────────────────────
  # Proves the JavaScript, Python, and Go reference verifiers all agree with
  # each other and the expected outcome on the canonical EP vectors. These are
  # one team's ports in one repository: a consistency check, not independent
  # clean-room implementations. The separately pinned Rust implementation runs
  # in the external-rust-evidence job below.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
      # The JavaScript invariant lane drives the real Gate runtime. Gate uses
      # the repository-local Verify SDK for algorithm-agile signatures, so the
      # locked root graph must be present even though the cross-language vector
      # runners themselves remain offline.
      - run: npm ci --ignore-scripts
      - run: python -m pip install --require-hashes -r .github/workflow-requirements/cryptography.txt
      - name: Cross-language conformance (EP-RECEIPT-v1, JS + Python + Go)
        env:
          NODE_OPTIONS: '--import ${{ github.workspace }}/scripts/ts-loader/register.mjs'
        run: node conformance/run.mjs
      - name: Conformance docs count guard
        run: npm run check:conformance-docs
      - name: SCITT statement identity and Capsule seam profile conformance
        run: |
          npm run conformance:composition:scitt-statement-identity
          npm run conformance:composition:scitt-capsule-seam
      - name: WIMSE WPT and OAuth transaction boundary conformance
        run: npm run conformance:composition:wimse-wpt02-oauth-txn-aeb
      - name: CCS historical evidence and CCS-09 optional mapping compatibility
        run: |
          npm run conformance:composition:ccs-v13-aeb
          npm run conformance:composition:ccs09-aeb
      - name: Crossing-record and adjacent native-authority compositions
        run: |
          npm run conformance:composition:crossing-record
          npm run conformance:composition:aic-aeb-crossing
          node --test conformance/composition/cedulon-mizan-leaked-refusal-v0.1/run.node-test.mjs
          node conformance/composition/cedulon-mizan-leaked-refusal-v0.1/run.mjs --check
      - name: Class-A signoff conformance (EP-SIGNOFF-v1, Node + Web Crypto)
        run: node conformance/run-signoffs.mjs
      - name: TLA+-invariant conformance (JS lane drives the real store + guards)
        env:
          NODE_OPTIONS: '--import ${{ github.workspace }}/scripts/ts-loader/register.mjs'
        run: node conformance/runners/run-invariants.mjs
      - name: TLA+-invariant conformance (Python lane — faithful state-machine port)
        run: python3 conformance/runners/run_invariants.py
      - name: TLA+-invariant conformance (Go lane — faithful state-machine port)
        run: go run conformance/runners/run_invariants.go
      # Hybrid post-quantum ports: EP-SIG-AGILITY-v1, EP-HYBRID-v1,
      # EP-RECEIPT-HYBRID-v1.
      # Both suites were committed and green locally while running in NO
      # runner. That is the exact failure mode scripts/run-package-suites.mjs
      # exists to prevent, so they are wired here, in the job that runs
      # unconditionally on every push and pull request to main, rather than in
      # go-verify.yml (path-filtered to packages/go-verify/**, so a change to a
      # vector or to the port itself would not have triggered it).
      #
      # conformance/go is its OWN Go module (go.mod + go.sum, backend
      # github.com/cloudflare/circl). `go test ./...` inside packages/go-verify
      # does not cross a module boundary, which is why this code was never
      # reached. The publish path is deliberately untouched:
      # publish-go-verify.yml diffs packages/go-verify against the bytes the Go
      # module proxy serves, and conformance/go is outside that tree.
      - name: PQ conformance (Go lane, live ML-DSA-65 backend via CIRCL)
        working-directory: conformance/go
        run: |
          go vet ./...
          go test -count=1 ./...
      # dilithium-py is a pure-Python FIPS 204 ML-DSA implementation with no
      # transitive dependencies, hash-pinned exactly like every other Python
      # entry here (uv pip compile --generate-hashes from the .in file). It
      # makes the ML-DSA-65 leg CRYPTOGRAPHICALLY LIVE in this job. Without it
      # the suite still passes fail-closed, with every post-quantum leg
      # refusing pq_backend_unavailable and every structural control still
      # enforced; the runner prints the mode it ran in, so a green log cannot
      # be mistaken for one that exercised the lattice. cryptography's own
      # ML-DSA needs an OpenSSL 3.5+ build that the pinned 46.0.6 wheel does
      # not expose, so it is not relied on here.
      - name: Install the hash-pinned ML-DSA backend and test runner
        run: python -m pip install --require-hashes -r .github/workflow-requirements/pq-conformance.txt
      - name: PQ conformance (Python lane, pytest port)
        run: python3 -m pytest conformance/py/test_ep_pq_verify.py
      - name: PQ conformance (Python lane, vector runner)
        run: python3 conformance/py/run_pq.py

  # ── Job 11c: Pinned external Rust implementation evidence ────────
  # Rebuilds an externally authored verifier from an immutable source tree and
  # evaluates it with its immutable, time-pinned vector and hostility snapshots.
  # Both lanes must pass; a green standard suite cannot conceal parser or
  # type-confusion failures in the adversarial corpus.
  external-rust-evidence:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out EMILIA evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out pinned external implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jdieselny/ecr-wg
          ref: 7faba36010e7590727bebbc5b9dcceee60539b9b
          path: .external/ecr-wg
          persist-credentials: false
      - name: Check out immutable hostility evaluator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: emiliaprotocol/emilia-protocol
          ref: 18739076c822bdc757147326e8d36716432d1b41
          path: .external/emilia-hostility-evaluator
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      # The evaluator verifies the externally produced result through Gate's
      # repository-local verification path. Install the locked workspace graph
      # before importing that path; the external Rust source and vector bundle
      # remain immutable and separately pinned below.
      - run: npm ci --ignore-scripts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --no-self-update
      - name: Rebuild external verifier from Cargo.lock
        run: >-
          cargo +1.94.1 build --release --locked
          --manifest-path .external/ecr-wg/rust/ep-cleanroom-verifier/Cargo.toml
          --bin conformance
      - name: Evaluate immutable byte-pinned conformance bundle
        run: |
          mkdir -p test-results
          node scripts/evaluate-external-implementation.mjs \
            --pin conformance/external/rust-cleanroom-jdieselny.v1.json \
            --source .external/ecr-wg \
            --runner .external/ecr-wg/rust/ep-cleanroom-verifier/target/release/conformance \
            --bundle conformance/clean-room/frozen-v1/conformance/clean-room/bundle.v1.json \
            --suite-root conformance/clean-room/frozen-v1 \
            --emit test-results/external-rust-conformance.json
      - name: Prepare suite-dispatch hostility runner
        run: |
          # JavaScript template literal below is intentionally single-quoted.
          # shellcheck disable=SC2016
          node --input-type=module -e \
            'import fs from "node:fs"; fs.writeFileSync(process.argv[1], `${JSON.stringify({ runners: [{ name: "rust-cleanroom-jdieselny", command: process.argv[2], args: [], cwd: ".", dispatch: "suite" }] }, null, 2)}\n`);' \
            test-results/external-rust-runner.json \
            "$GITHUB_WORKSPACE/.external/ecr-wg/rust/ep-cleanroom-verifier/target/release/conformance"
      - name: Run external differential hostility campaign
        run: |
          node "$GITHUB_WORKSPACE/.external/emilia-hostility-evaluator/scripts/differential-hostility.mjs" \
            --external-runners "$GITHUB_WORKSPACE/test-results/external-rust-runner.json" \
            --emit "$GITHUB_WORKSPACE/test-results/external-rust-hostility.json"
      - name: Enforce pinned accepting hostility result
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const pin = JSON.parse(fs.readFileSync("conformance/external/rust-cleanroom-jdieselny.v1.json", "utf8"));
            const report = JSON.parse(fs.readFileSync("test-results/external-rust-hostility.json", "utf8"));
            const expected = pin.hostility;
            if (expected.evaluator_commit !== "18739076c822bdc757147326e8d36716432d1b41") throw new Error("external hostility evaluator pin drifted");
            if (report.status !== expected.required_status || report.divergences.length !== 0) throw new Error("external hostility campaign is not clean");
            if (report.corpus?.suite !== expected.suite || report.corpus?.sha256 !== expected.corpus_sha256) throw new Error("external hostility corpus drifted from the reviewed pin");
            if (report.corpus?.structured_cases !== expected.structured_cases || report.corpus?.raw_parser_cases !== expected.raw_parser_cases) throw new Error("external hostility case counts drifted from the reviewed pin");
            if (!report.implementations?.some((implementation) => implementation.name === expected.runner_name && implementation.relationship === "external-submission")) throw new Error("external implementation is absent from hostility report");
          '
      - name: Upload external evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: external-rust-evidence
          path: |
            test-results/external-rust-conformance.json
            test-results/external-rust-hostility.json
          retention-days: 90

  # ── Job 11d: Aggregate, attested conformance acceptance case ─────
  # Joins the same-team manifest over the frozen external bundle and separately produced external evidence
  # only after both jobs pass. The assembler revalidates every source pin,
  # suite hash, hostility result, evaluator commit, and attestation boundary;
  # it cannot promote implementer-signed legacy evidence to strict independent
  # clean-room acceptance.
  aggregate-conformance-case:
    needs: [changes, security-case, external-rust-evidence]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') && needs.security-case.result == 'success' && needs.external-rust-evidence.result == 'success' }}
    runs-on: ubuntu-latest
    # Same attestation boundary as security-case: verifiers pin
    # --source-ref refs/heads/main, never a merge-queue ref.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Download exact base conformance manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-and-conformance-case
          path: .ci/base
      - name: Download exact external evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: external-rust-evidence
          path: .ci/external
      - name: Assemble strict aggregate conformance case
        run: >-
          node scripts/assemble-conformance-case.mjs
          --manifest .ci/base/conformance/clean-room/conformance-manifest.v1.json
          --pin conformance/external/rust-cleanroom-jdieselny.v1.json
          --external-conformance .ci/external/external-rust-conformance.json
          --external-hostility .ci/external/external-rust-hostility.json
          --evaluator-commit "$GITHUB_SHA"
          --emit conformance/conformance-case.json
      - name: Attest aggregate conformance case on protected-branch runs
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: conformance/conformance-case.json
      - name: Upload aggregate conformance case
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aggregate-conformance-case
          path: conformance/conformance-case.json
          retention-days: 90

  # ── langchain-emilia (Python) — executor-side guard for LangChain tools ──
  langchain-emilia:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install hash-locked test dependencies
        run: |
          python -m venv "$RUNNER_TEMP/langchain-emilia-venv"
          "$RUNNER_TEMP/langchain-emilia-venv/bin/python" -m pip install \
            --require-hashes -r .github/workflow-requirements/langchain-test.txt
      - name: Build and install the exact wheel
        run: |
          python -m pip wheel --no-deps \
            --wheel-dir "$RUNNER_TEMP/langchain-emilia-dist" \
            integrations/langchain-emilia
          "$RUNNER_TEMP/langchain-emilia-venv/bin/python" -m pip install \
            --no-deps "$RUNNER_TEMP"/langchain-emilia-dist/langchain_emilia-*.whl
      - name: Tests (digest parity, gate semantics, fail-closed tool wrapping)
        run: |
          STAGE="$RUNNER_TEMP/langchain-emilia-tests"
          mkdir -p "$STAGE/integrations/langchain-emilia"
          cp -R integrations/langchain-emilia/tests "$STAGE/integrations/langchain-emilia/tests"
          cd "$STAGE"
          MODULE_FILE=$("$RUNNER_TEMP/langchain-emilia-venv/bin/python" -c \
            'import langchain_emilia; print(langchain_emilia.__file__)')
          case "$MODULE_FILE" in
            "$GITHUB_WORKSPACE"/*|"$STAGE"/*)
              echo "langchain_emilia did not load from the installed wheel: $MODULE_FILE" >&2
              exit 1
              ;;
          esac
          "$RUNNER_TEMP/langchain-emilia-venv/bin/python" -m pytest \
            -q --import-mode=importlib integrations/langchain-emilia/tests

  # ── Executor-bound approval gate red-team regression ─────────────
  # Re-runs the executor-side offline-verification attacks and genuine controls.
  # Uses the local JS-signed fixture + locally generated attacker keys — NO
  # network and NO production access. Also exercises the pure-Python verifier.
  examples-grok-guard-redteam:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install verifier deps (cryptography)
        run: python -m pip install --require-hashes -r .github/workflow-requirements/cryptography.txt
      - name: Compile executor approval examples
        run: python -m py_compile examples/executor_approval_gate.py examples/grok_guard.py examples/claude_guard.py
      - name: Red-team executor-bound approval gate
        env:
          PYTHONPATH: packages/python-verify
        run: python examples/tests/test_executor_approval_gate_redteam.py

  # ── Job 12: OpenAPI spec linting ─────────────────────────────────
  openapi-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Lint OpenAPI spec
        run: npx @redocly/cli lint openapi.yaml

  # ── Job 13: Docs consistency ─────────────────────────────────────
  docs-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify executable AIUC incident-field proposal
        run: node --test standards/aiuc/incident-fields-v0/validate.selftest.mjs

      # NOTE on --exclude-dir=.github: every grep here scans the working tree
      # for stale strings. The grep patterns themselves live in this
      # workflow file (and any future PR description / CHANGELOG entry).
      # Without --exclude-dir=.github, each check would self-match the
      # pattern literal in this file and fail. The CHANGELOG-filter on the
      # tool-count and SDK-name checks works only by accident (every line
      # containing those literals also contains "CHANGELOG"); the v0.2.0
      # check did not have that accident and broke. Adding the exclude
      # makes the no-self-match guarantee structural, not accidental.

      - name: No stale tool counts outside CHANGELOG
        run: |
          hits=$(grep -rn '"15 tools"\|"20 tools"\|"22 tools"\|"23 tools"\|15 tools\|20 tools\|22 tools\|23 tools' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.js' --include='*.ts' --include='*.json' --exclude-dir=node_modules --exclude-dir=.github . | grep -v CHANGELOG || true)
          if [ -n "$hits" ]; then
            echo "::error::Stale tool counts found outside CHANGELOG:"
            echo "$hits"
            exit 1
          fi
          echo "OK — no stale tool counts found."

      - name: No stale test counts outside CHANGELOG
        run: |
          hits=$(grep -rn '"152 tests"\|"152 passing"\|152 tests\|152 passing' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.js' --include='*.ts' --include='*.json' --exclude-dir=node_modules --exclude-dir=.github . | grep -v CHANGELOG || true)
          if [ -n "$hits" ]; then
            echo "::error::Stale test counts found outside CHANGELOG:"
            echo "$hits"
            exit 1
          fi
          echo "OK — no stale test counts found."

      - name: No old SDK name EmiliaClient outside CHANGELOG
        run: |
          hits=$(grep -rn 'EmiliaClient' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.js' --include='*.ts' --include='*.json' --exclude-dir=node_modules --exclude-dir=.github . | grep -v CHANGELOG || true)
          if [ -n "$hits" ]; then
            echo "::error::Old SDK name 'EmiliaClient' found outside CHANGELOG:"
            echo "$hits"
            exit 1
          fi
          echo "OK — no old SDK name found."

      - name: No references to v0.2.0
        run: |
          hits=$(grep -rn 'v0\.2\.0' --include='*.md' --include='*.yml' --include='*.yaml' --include='*.js' --include='*.ts' --include='*.json' --exclude-dir=node_modules --exclude-dir=.github . || true)
          if [ -n "$hits" ]; then
            echo "::error::Stale version 'v0.2.0' references found:"
            echo "$hits"
            exit 1
          fi
          echo "OK — no v0.2.0 references found."

      - name: Tool count in mcp-server/index.js matches README badge
        run: |
          # Count ACTUAL tool registrations, not any substring containing ep_.
          # Tool registrations look like:  name: 'ep_xxx'  or  name: "ep_xxx"
          # The previous `grep -c 'ep_'` matched comments, docstrings, type
          # imports, and other incidental occurrences (122 false matches vs
          # 34 real tool definitions).
          tool_count=$(grep -cE "name:\s*['\"]ep_" mcp-server/index.js || echo 0)
          echo "Found $tool_count ep_ tool registrations in mcp-server/index.js"
          badge_count=$(grep -oP '\d+(?=\+? tools)' README.md | head -1 || echo "NOT_FOUND")
          echo "README badge claims: $badge_count tools"
          if [ "$badge_count" = "NOT_FOUND" ] || [ -z "$badge_count" ]; then
            # README intentionally no longer states a tool count — nothing to drift.
            echo "README states no tool count — nothing to check."
          elif [ "$tool_count" != "$badge_count" ]; then
            echo "::error::Mismatch: mcp-server/index.js has $tool_count ep_ tool registrations but README badge says $badge_count"
            exit 1
          else
            echo "OK — tool count matches ($tool_count)."
          fi

      - name: OpenAPI path coverage (core routes must be documented)
        run: |
          spec_paths=$(grep -c '^\s\+/api/' openapi.yaml || echo 0)
          # Exclude surfaces that are intentionally documented OUTSIDE EP's
          # protocol OpenAPI (mirrors the OPENAPI_EXEMPTIONS in
          # tests/route-coverage.test.ts): SCIM is RFC 7643/7644 + its own
          # ServiceProviderConfig; the pilot sandbox is GTM onboarding tooling.
          route_files=$(find app/api \( -name route.js -o -name route.ts \) 2>/dev/null | grep -cvE '/api/scim/|/api/sso/|/api/pilot/|/api/badge/|/api/demo/|/api/score/' || true)
          echo "openapi.yaml paths: $spec_paths"
          echo "core app/api route files (excl. scim, sso, pilot): $route_files"
          # Enforce minimum 75% coverage — cloud/operational routes may be documented separately.
          # Full parity remains an open hardening milestone. The enforced
          # current floor is 75%; no completed full-parity claim is made.
          min_paths=$(( route_files * 75 / 100 ))
          if [ "$spec_paths" -lt "$min_paths" ]; then
            echo "::error::OpenAPI coverage too low: $spec_paths/$route_files paths documented (minimum: $min_paths)"
            exit 1
          fi
          echo "OK — OpenAPI coverage $spec_paths/$route_files ($(( spec_paths * 100 / route_files ))%)."

  # ── Job 14: Secret scanning (gitleaks) ──────────────────────────
  # Uses gitleaks CLI directly (MIT, free) instead of the gitleaks-action
  # wrapper (now requires paid GITLEAKS_LICENSE secret).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks CLI
        # Pin the version AND verify the SHA-256 (from the release's published
        # checksums.txt) so a re-cut/compromised asset can't inject a binary.
        # To bump: change GITLEAKS_VERSION and update GITLEAKS_SHA256.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          GITLEAKS_VERSION=8.21.2
          GITLEAKS_ASSET_ID=202338480
          GITLEAKS_SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          asset_url="https://api.github.com/repos/gitleaks/gitleaks/releases/assets/${GITLEAKS_ASSET_ID}"
          # --fail: error out on HTTP 4xx/5xx instead of saving an error page that
          # tar then chokes on (a rate-limited download saved as HTML — not a real
          # leak — was the historical "exit code 2"). Retry transient 429/5xx.
          scripts/download-pinned-github-asset.sh \
            "$url" "$asset_url" "$GITLEAKS_SHA256" gitleaks.tar.gz
          tar xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version
      - name: Run gitleaks
        run: |
          gitleaks detect --source . --verbose --redact --exit-code 1 --no-banner

  # ── Job 15: Docs secrets lint ──────────────────────────────────
  docs-secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Enforce public/private repository boundary
        run: node scripts/check-repository-boundary.js
      - name: Verify staged Internet-Draft packet bytes
        run: npm run check:standards-staged
      - name: Verify AE Challenge 08 submission packet
        run: npm run check:ae-challenge-08
      - name: Check docs for leaked secrets
        run: node scripts/check-docs-secrets.js

  # ── Job 16: Docker build smoke test ──────────────────────────────
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Docker image
        run: docker build -t ep-test .

  # ── Job 17: E2E smoke tests (Playwright) ─────────────────────────
  # Runs the Playwright smoke suite against the **production** Next.js
  # server (`npm run build` + `npm run start`), not `npm run dev`. The
  # dev-server route was previously gated as workflow_dispatch because it
  # was slow (~5 min), flaky, and pulled vitest into Playwright's runner.
  # Production server boots in ~3s, behaves like prod, and the vitest
  # confusion is resolved by the e2e/** exclude in vitest.config.js.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
        env:
          # next build needs valid envs at compile time; supply minimal stubs
          # so the build doesn't fail trying to read real secrets.
          # The production page executes its readiness probe at request time.
          # Compile the same loopback URL that Playwright's inert RPC stub owns
          # so Agent Record recovery is exercised without a real deployment.
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'e2e-anon-key'
      - name: Run E2E smoke tests
        run: npx playwright test
        env:
          CI: 'true'
          # `next start` re-reads NEXT_PUBLIC_* at boot for runtime config —
          # keep parity with the build step so the production server starts.
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'e2e-anon-key'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Job 18: Postgres integration tests ───────────────────────────
  integration-postgres:
    needs: [changes]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.lane != 'docs') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        # AWS Public ECR mirror of the official image — identical bits, but not
        # subject to Docker Hub's anonymous pull rate limits, which were
        # intermittently failing this job on shared GitHub runners.
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_USER: ep_test
          # Per-run password (never reused) for this ephemeral, network-isolated
          # CI service — no static credential in the repo.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: ep_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ep_test -d ep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run Postgres integration tests
        run: >-
          npx vitest run --no-file-parallelism
          tests/postgres-integration.test.ts
          tests/agent-adoption-postgres.integration.test.ts
          tests/agent-record-postgres.test.ts
          tests/consequence-actuator-provider-record-postgres.test.ts
          tests/rollout-attempt-role-graph-postgres.test.ts
          tests/history-reconciliation-forward-postgres.test.ts
          tests/capability-action-fence-migration-chain-postgres.test.ts
          tests/identity-continuity-atomic-postgres.integration.test.ts
        env:
          INTEGRATION_POSTGRES: '1'
          PGHOST: localhost
          PGPORT: '5433'
          PGUSER: ep_test
          PGPASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          PGDATABASE: ep_test
      - name: Run Gate AdmissionStore PostgreSQL contract
        run: node --test --import tsx packages/gate/admission-store-postgres.test.ts
        env:
          ADMISSION_STORE_POSTGRES_TEST_URL: postgresql://ep_test:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5433/ep_test
      - name: Run Gate capability PostgreSQL contract
        run: node --test --import tsx packages/gate/capability-receipt.test.ts
        env:
          ADMISSION_STORE_POSTGRES_TEST_URL: postgresql://ep_test:ci-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5433/ep_test
