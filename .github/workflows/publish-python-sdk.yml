name: Publish Python SDK

permissions: read-all

# Opt every JavaScript-based action into the Node.js 24 runner.
# GitHub forces this default in June 2026; doing it now eliminates the
# deprecation-warning noise on every run and surfaces any Node-24 incompat
# early. Affects actions/checkout, actions/setup-node, actions/upload-artifact, etc.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact tag, for example py-sdk-v1.0.1
        required: true
        type: string
      confirmation:
        description: Type PUBLISH emilia-protocol@<version>
        required: true
        type: string

jobs:
  publish:
    name: Publish emilia-protocol
    runs-on: ubuntu-latest
    environment: registry-publishing-approval
    env:
      TLA2TOOLS_JAR: ${{ github.workspace }}/tla2tools.jar
    concurrency:
      group: registry-publish-pypi-emilia-protocol
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java for the pinned formal-methods oracle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the pinned TLA+ model checker
        env:
          TLA_VERSION: v1.7.4
          TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          curl --fail --location --silent --show-error \
            -o tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_SHA256}  tla2tools.jar" | sha256sum -c -

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.0'

      - name: Install hash-locked build and verification tooling
        run: python -m pip install --require-hashes -r .github/workflow-requirements/release.txt

      - name: Install JavaScript test tooling
        run: npm ci --ignore-scripts

      - name: Require owner approval bound to tag, package, version, and main
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('sdks/python/pyproject.toml','rb'))['project']['version'])")
          node scripts/require-release-approval.mjs \
            --allowed-actor FutureEnterprises \
            --tag "$RELEASE_TAG" \
            --tag-prefix py-sdk-v \
            --package emilia-protocol \
            --version "$VERSION" \
            --confirmation "$RELEASE_CONFIRMATION"

      - name: Generate signed-evidence inputs
        run: |
          npm run security-case:emit
          npm run conformance:manifest

      - name: Build twice and retain the exact reproducible artifacts
        id: build
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          node scripts/verify-reproducible-wheel.mjs sdks/python \
            --emit release-artifacts/python-sdk-reproducible.json \
            --outdir release-artifacts
          WHEEL=$(find release-artifacts/python -maxdepth 1 -name '*.whl' -print -quit)
          SDIST=$(find release-artifacts/python -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$WHEEL" && test -n "$SDIST"
          echo "wheel=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "sdist=$SDIST" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the exact wheel in a clean environment
        env:
          EMILIA_SDK_WHEEL_TEST: '1'
        run: |
          python -m venv "$RUNNER_TEMP/python-sdk-release-venv"
          "$RUNNER_TEMP/python-sdk-release-venv/bin/python" -m pip install \
            --no-deps "${{ steps.build.outputs.wheel }}"
          "$RUNNER_TEMP/python-sdk-release-venv/bin/python" -m unittest discover \
            -s sdks/python/tests -v

      - name: Check exact distributions
        run: python -m twine check release-artifacts/python/*.whl release-artifacts/python/*.tar.gz

      - name: Attest exact wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.wheel }}

      - name: Attest exact source distribution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.sdist }}

      - name: Attest conformance and security manifests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: |
            security/security-case.json
            conformance/conformance-manifest.json
            release-artifacts/python-sdk-reproducible.json

      - name: Upload exact release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-sdk-release-${{ inputs.release_tag }}
          path: |
            release-artifacts/python/
            release-artifacts/python-sdk-reproducible.json
            security/security-case.json
            conformance/conformance-manifest.json
          retention-days: 90

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: release-artifacts/python/
          skip-existing: true

      - name: Verify PyPI wheel and sdist bytes match the attested artifacts
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('sdks/python/pyproject.toml','rb'))['project']['version'])")
          mkdir -p registry-copy
          for attempt in {1..36}; do
            if python -m pip download --no-cache-dir --no-deps --only-binary=:all: --dest registry-copy "emilia-protocol==$VERSION" \
              && python -m pip download --no-cache-dir --no-deps --no-binary=:all: --no-build-isolation --dest registry-copy "emilia-protocol==$VERSION"; then
              break
            fi
            sleep 5
          done
          REGISTRY_WHEEL=$(find registry-copy -maxdepth 1 -name '*.whl' -print -quit)
          REGISTRY_SDIST=$(find registry-copy -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$REGISTRY_WHEEL" && test -n "$REGISTRY_SDIST"
          cmp "${{ steps.build.outputs.wheel }}" "$REGISTRY_WHEEL"
          cmp "${{ steps.build.outputs.sdist }}" "$REGISTRY_SDIST"
