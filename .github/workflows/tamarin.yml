name: Tamarin Symbolic Protocol Proofs

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    paths:
      - 'formal/tamarin/**'
      - '.github/workflows/tamarin.yml'
  pull_request:
    paths:
      - 'formal/tamarin/**'
      - '.github/workflows/tamarin.yml'
  workflow_dispatch:

jobs:
  composed-reliance:
    # The pinned prover digest is a linux/arm64-only manifest (checked against the
    # registry), so this job runs on GitHub's arm64 runner and CI executes the exact
    # same image bytes the proof was verified with locally.
    runs-on: ubuntu-24.04-arm
    # The composed suite now proves 20 obligations independently, including
    # deliberately unsafe comparisons that must produce counterexamples. The
    # pinned arm64 prover completed 16 obligations before the former 30-minute
    # ceiling terminated a healthy run, so retain the full proof surface and
    # give it a realistic bounded execution window.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify pinned model bytes
        working-directory: formal/tamarin
        run: |
          echo '7c6f623e6cec025a49054e42b2b384a16cbea98f4d1d0e05c6fd4c4ff077e968  ep_reliance_composed.spthy' | sha256sum -c -
          echo '80c64c9b85eaa4781542d5cbf8f2f9e54ea62d3cbf2e8efa8723f1e41c847e3b  ep_six_claim_composed.spthy' | sha256sum -c -
          echo 'c04a9471d29c3d8164c52b2f2e01b38275d1fdc47ccdd587561315e8835e640f  run-composed.sh' | sha256sum -c -
      - name: Run every composed proof obligation independently
        working-directory: formal/tamarin
        shell: bash
        run: sh ./run-composed.sh | tee composed-output.txt
      - name: Upload complete prover output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tamarin-composed-output
          path: |
            formal/tamarin/composed-output.txt
            formal/tamarin/run-output/*.txt
          retention-days: 90

  receipt-core:
    # Same pinned arm64-only prover digest as composed-reliance; runs the
    # standalone receipt-core component model so it is gated independently of
    # the composition (audit GAP 10).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify pinned model bytes
        working-directory: formal/tamarin
        run: |
          echo '99777fe702d58a731fcb35f3879459f867c8869e14113c810d3997172e4b2da1  ep_receipt_core.spthy' | sha256sum -c -
          echo 'b710f30b1ae4e62a2eeef39c00ef9b7322901e43185860c51bd930b2a5c63a26  run-receipt-core.sh' | sha256sum -c -
      - name: Run every receipt-core proof obligation independently
        working-directory: formal/tamarin
        shell: bash
        run: sh ./run-receipt-core.sh | tee receipt-output.txt
      - name: Upload complete prover output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tamarin-receipt-core-output
          path: |
            formal/tamarin/receipt-output.txt
            formal/tamarin/run-output-receipt/*.txt
          retention-days: 90

  quorum-core:
    # Same pinned arm64-only prover digest as composed-reliance; runs the
    # standalone quorum-core component model so it is gated independently of
    # the composition (audit GAP 10).
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Verify pinned model bytes
        working-directory: formal/tamarin
        run: |
          echo 'c71a116bd0bc1326876e569b893f2b197f736d9fbf76f787938e87137355cc20  ep_quorum_core.spthy' | sha256sum -c -
          echo '3dcaf37a0d1fa047bc655319ee35959b3f4ee6fc6afde358b7487eb5227691d7  run-quorum.sh' | sha256sum -c -
      - name: Run every quorum-core proof obligation independently
        working-directory: formal/tamarin
        shell: bash
        run: sh ./run-quorum.sh | tee quorum-output.txt
      - name: Upload complete prover output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tamarin-quorum-core-output
          path: |
            formal/tamarin/quorum-output.txt
            formal/tamarin/run-output-quorum/*.txt
          retention-days: 90
