name: Publish Verify SDK

# npm trusted publisher identity remains this caller workflow:
# @emilia-protocol/verify -> publish-verify-sdk.yml, protected by the
# registry-publishing-approval environment inside the reusable publisher job.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact tag, for example verify-v3.15.1
        required: true
        type: string
      confirmation:
        description: Type PUBLISH @emilia-protocol/verify@<version>
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_publish-npm-package.yml
    with:
      package_dir: packages/verify
      package_name: '@emilia-protocol/verify'
      artifact_id: verify
      release_tag: ${{ inputs.release_tag }}
      confirmation: ${{ inputs.confirmation }}
      tag_prefix: verify-v
