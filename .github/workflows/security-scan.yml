name: Security Scan

permissions: read-all

# Opt every JavaScript-based action into the Node.js 24 runner.
# GitHub forces this default in June 2026; doing it now eliminates the
# deprecation-warning noise on every run and surfaces any Node-24 incompat
# early. Affects actions/checkout, actions/setup-node, actions/upload-artifact, etc.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The required npm audit check must also report on merge-queue candidates.
  merge_group:
    types: [checks_requested]

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 20
      - run: npm ci --ignore-scripts
      - name: Check for known vulnerabilities (root)
        # Two reviewed exceptions, both confined to build/lint transitives:
        # npm's GHSA-mh99 range still includes the cap-enforced brace-expansion
        # backport, and GHSA-vfj7 (braces <=3.0.3, no patched release) reaches
        # only the dev-only eslint-config-next -> fast-glob -> micromatch copy.
        # The policy script rejects every other advisory, pins each installed
        # copy and the reported dependency set, runs a resource-bound probe for
        # each, and the braces exception expires on its recheck date.
        run: npm run audit:root
      # mcp-server ships a bundled stdio runtime and keeps the MCP SDK/build tools
      # as development-only inputs. Audit the dependencies that actually ship to
      # users; bundle parity is enforced by the mcp-server-pack CI job.
      # (sdks/typescript is intentionally NOT audited: the package has zero
      # runtime dependencies — vite is a dev-only transitive of vitest and is
      # never shipped to consumers.)
      - name: Check for known vulnerabilities (mcp-server)
        working-directory: mcp-server
        run: npm audit --package-lock-only --omit=dev --audit-level=moderate
