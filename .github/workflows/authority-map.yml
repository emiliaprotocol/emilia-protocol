name: EMILIA Authority Map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'integrations/github-authority-map-action/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the reviewed repository revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Map visible workflow authority
        id: authority-map
        uses: ./integrations/github-authority-map-action
        with:
          fail-on: never

      - name: Preserve the static inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emilia-authority-map
          path: |
            ${{ steps.authority-map.outputs.json-path }}
            ${{ steps.authority-map.outputs.markdown-path }}
          if-no-files-found: error
          retention-days: 14
