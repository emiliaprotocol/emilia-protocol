name: Consequence Control Protected Deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Zero-traffic candidate deployment or one-time stable bootstrap
        required: true
        type: choice
        options:
          - deploy-candidates
          - bootstrap-stable
      bootstrap_id:
        description: Required short revision ID for bootstrap-stable
        required: false
        type: string
      placeholder_image:
        description: Required digest-pinned deny-all image for bootstrap-stable
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: consequence-control-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'emiliaprotocol/emilia-protocol' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: consequence-control-production
    env:
      EMILIA_DEPLOY_ENVIRONMENT: consequence-control-production
      EMILIA_GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      EMILIA_DEPLOY_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - name: Check out the exact protected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate keylessly as the protected deploy identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI action
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Materialize candidate-deploy coordinates
        if: inputs.operation == 'deploy-candidates'
        id: deploy-config
        shell: bash
        env:
          CONSEQUENCE_CONTROL_DEPLOY_CONFIG: ${{ secrets.CONSEQUENCE_CONTROL_DEPLOY_CONFIG }}
        run: |
          set -euo pipefail
          [[ -n "$CONSEQUENCE_CONTROL_DEPLOY_CONFIG" ]]
          config_path="$RUNNER_TEMP/consequence-control-deploy.env"
          umask 077
          printf '%s\n' "$CONSEQUENCE_CONTROL_DEPLOY_CONFIG" > "$config_path"
          printf 'path=%s\n' "$config_path" >> "$GITHUB_OUTPUT"

      - name: Materialize stable-bootstrap coordinates
        if: inputs.operation == 'bootstrap-stable'
        id: bootstrap-config
        shell: bash
        env:
          CONSEQUENCE_CONTROL_BOOTSTRAP_CONFIG: ${{ secrets.CONSEQUENCE_CONTROL_BOOTSTRAP_CONFIG }}
        run: |
          set -euo pipefail
          [[ -n "$CONSEQUENCE_CONTROL_BOOTSTRAP_CONFIG" ]]
          config_path="$RUNNER_TEMP/consequence-control-bootstrap.env"
          umask 077
          printf '%s\n' "$CONSEQUENCE_CONTROL_BOOTSTRAP_CONFIG" > "$config_path"
          printf 'path=%s\n' "$config_path" >> "$GITHUB_OUTPUT"

      - name: Deploy digest-pinned zero-traffic candidates
        if: inputs.operation == 'deploy-candidates'
        shell: bash
        env:
          DEPLOYMENT_APPROVED: "true"
          DEPLOYMENT_CONFIRM_PROJECT: ${{ vars.GCP_CONSEQUENCE_CONTROL_PROJECT }}
          DEPLOYMENT_CONFIG_SHA256: ${{ vars.CONSEQUENCE_CONTROL_DEPLOY_CONFIG_SHA256 }}
        run: |
          set -euo pipefail
          deploy/consequence-control-cloud-run/deploy.sh \
            --config "${{ steps.deploy-config.outputs.path }}" \
            --apply

      - name: Bootstrap digest-pinned deny-all stable revisions
        if: inputs.operation == 'bootstrap-stable'
        shell: bash
        env:
          DEPLOYMENT_APPROVED: "true"
          DEPLOYMENT_CONFIG_SHA256: ${{ vars.CONSEQUENCE_CONTROL_BOOTSTRAP_CONFIG_SHA256 }}
          BOOTSTRAP_ID: ${{ inputs.bootstrap_id }}
          PLACEHOLDER_IMAGE: ${{ inputs.placeholder_image }}
        run: |
          set -euo pipefail
          [[ "$BOOTSTRAP_ID" =~ ^[a-z][a-z0-9-]{0,20}$ ]]
          [[ "$PLACEHOLDER_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          deploy/consequence-control-cloud-run/bootstrap-stable.sh \
            --config "${{ steps.bootstrap-config.outputs.path }}" \
            --bootstrap-id "$BOOTSTRAP_ID" \
            --placeholder-image "$PLACEHOLDER_IMAGE" \
            --output "$RUNNER_TEMP/stable-release.json" \
            --apply

      - name: Preserve the signed stable bootstrap manifest
        if: inputs.operation == 'bootstrap-stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consequence-control-stable-${{ inputs.bootstrap_id }}
          path: ${{ runner.temp }}/stable-release.json
          if-no-files-found: error
          retention-days: 30
