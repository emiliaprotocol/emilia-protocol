name: Consequence Control Protected Deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Protected candidate, bootstrap, promotion, or rollback operation
        required: true
        type: choice
        options:
          - deploy-candidates
          - bootstrap-stable
          - apply-decision-1
          - apply-decision-10
          - apply-decision-50
          - apply-decision-100
          - apply-actuator-100
          - apply-rollback
      bootstrap_id:
        description: Required short revision ID for bootstrap-stable
        required: false
        type: string
      placeholder_image:
        description: Required digest-pinned deny-all image for bootstrap-stable
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: consequence-control-production
  cancel-in-progress: false

jobs:
  candidate-release:
    if: >-
      github.repository == 'emiliaprotocol/emilia-protocol' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'deploy-candidates'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out the exact protected revision without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install the governed Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install reviewed release dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build and seal credential-free candidate images
        shell: bash
        run: |
          set -euo pipefail
          build_dir="$RUNNER_TEMP/consequence-control-bundle"
          deploy/consequence-control-cloud-run/build-release-images.sh \
            --bundle \
            --expected-commit "$GITHUB_SHA" \
            --output "$build_dir"

      - name: Upload the exact sealed release bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consequence-control-sealed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/consequence-control-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release-approval:
    needs: candidate-release
    if: >-
      always() &&
      github.repository == 'emiliaprotocol/emilia-protocol' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      (inputs.operation != 'deploy-candidates' || needs.candidate-release.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      request-sha256: ${{ steps.request.outputs.sha256 }}
    steps:
      - name: Check out reviewed verification code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download candidate bundle by exact immutable artifact ID
        if: inputs.operation == 'deploy-candidates'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.candidate-release.outputs.artifact-id }}
          path: ${{ runner.temp }}/sealed-candidate
          merge-multiple: true

      - name: Verify and load both sealed images without production credentials
        if: inputs.operation == 'deploy-candidates'
        shell: bash
        env:
          SEALED_ARTIFACT_DIGEST: ${{ needs.candidate-release.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "$SEALED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          bundle_dir="$RUNNER_TEMP/sealed-candidate"
          deploy/consequence-control-cloud-run/release-trust.py verify-bundle \
            --root "$GITHUB_WORKSPACE" \
            --bundle-dir "$bundle_dir" \
            --bundle-manifest "$bundle_dir/bundle-manifest.json" \
            --expected-commit "$GITHUB_SHA"
          deploy/consequence-control-cloud-run/release-trust.py load-bundle \
            --root "$GITHUB_WORKSPACE" \
            --bundle-dir "$bundle_dir" \
            --bundle-manifest "$bundle_dir/bundle-manifest.json" \
            --expected-commit "$GITHUB_SHA" \
            --docker-bin "$(command -v docker)"

      - name: Seal the inert trusted-executor request
        id: request
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          BOOTSTRAP_ID: ${{ inputs.bootstrap_id }}
          PLACEHOLDER_IMAGE: ${{ inputs.placeholder_image }}
          CANDIDATE_ARTIFACT_ID: ${{ needs.candidate-release.outputs.artifact-id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.candidate-release.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            deploy-candidates|bootstrap-stable|apply-decision-1|apply-decision-10|apply-decision-50|apply-decision-100|apply-actuator-100|apply-rollback)
              ;;
            *)
              printf 'unsupported protected operation\n' >&2
              exit 1
              ;;
          esac
          request_dir="$RUNNER_TEMP/consequence-control-request"
          install -d -m 700 "$request_dir"
          umask 077
          printf 'EMILIA-CONSEQUENCE-TRUSTED-EXECUTOR-REQUEST-v1\n' > "$request_dir/version"
          printf '%s\n' "$OPERATION" > "$request_dir/operation"
          printf '%s\n' "$GITHUB_SHA" > "$request_dir/commit"
          printf '%s\n' "$GITHUB_WORKFLOW_SHA" > "$request_dir/workflow-sha"
          printf '%s\n' "$GITHUB_RUN_ID" > "$request_dir/run-id"
          printf '%s\n' "$GITHUB_RUN_ATTEMPT" > "$request_dir/run-attempt"
          printf '%s\n' "$BOOTSTRAP_ID" > "$request_dir/bootstrap-id"
          printf '%s\n' "$PLACEHOLDER_IMAGE" > "$request_dir/placeholder-image"
          printf '%s\n' "$CANDIDATE_ARTIFACT_ID" > "$request_dir/candidate-artifact-id"
          printf '%s\n' "$CANDIDATE_ARTIFACT_DIGEST" > "$request_dir/candidate-artifact-digest"
          if [[ "$OPERATION" == deploy-candidates ]]; then
            install -d -m 700 "$request_dir/candidate-bundle"
            cp -R "$RUNNER_TEMP/sealed-candidate/." "$request_dir/candidate-bundle/"
          fi
          request_archive="$RUNNER_TEMP/deployment-request.tar.gz"
          tar \
            --sort=name \
            --mtime=@0 \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -czf "$request_archive" \
            -C "$request_dir" .
          request_sha="$(sha256sum "$request_archive")"
          request_sha="${request_sha%% *}"
          [[ "$request_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'sha256=%s\n' "$request_sha" >> "$GITHUB_OUTPUT"

      - name: Upload exact immutable approved deployment request
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consequence-control-approved-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-request.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    needs: release-approval
    if: >-
      github.repository == 'emiliaprotocol/emilia-protocol' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      needs.release-approval.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: consequence-control-production
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      EMILIA_DEPLOY_ENVIRONMENT: consequence-control-production
      EMILIA_GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      EMILIA_DEPLOY_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - name: Download exact approved request by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.release-approval.outputs.artifact-id }}
          path: ${{ runner.temp }}/approved-request
          merge-multiple: true

      - name: Verify the exact inert request before authentication
        shell: bash
        env:
          APPROVED_ARTIFACT_ID: ${{ needs.release-approval.outputs.artifact-id }}
          APPROVED_ARTIFACT_DIGEST: ${{ needs.release-approval.outputs.artifact-digest }}
          EXPECTED_REQUEST_SHA256: ${{ needs.release-approval.outputs.request-sha256 }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          request_path="$RUNNER_TEMP/approved-request/deployment-request.tar.gz"
          [[ -f "$request_path" && ! -L "$request_path" ]]
          printf '%s  %s\n' "$EXPECTED_REQUEST_SHA256" "$request_path" | sha256sum --check --status

      - name: Authenticate keylessly as the protected submitter
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI action
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Attest the exact approved trusted-executor request
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ runner.temp }}/approved-request/deployment-request.tar.gz

      - name: Submit inert request to the independently pinned executor
        shell: bash
        env:
          APPROVED_ARTIFACT_ID: ${{ needs.release-approval.outputs.artifact-id }}
          APPROVED_ARTIFACT_DIGEST: ${{ needs.release-approval.outputs.artifact-digest }}
          EXPECTED_REQUEST_SHA256: ${{ needs.release-approval.outputs.request-sha256 }}
          OPERATION: ${{ inputs.operation }}
          REQUEST_BUCKET: ${{ vars.GCP_CONSEQUENCE_CONTROL_REQUEST_BUCKET }}
          TRUSTED_EXECUTOR_IMAGE: ${{ vars.GCP_CONSEQUENCE_CONTROL_TRUSTED_EXECUTOR_IMAGE }}
          TRUSTED_EXECUTOR_SERVICE_ACCOUNT: ${{ vars.GCP_CONSEQUENCE_CONTROL_TRUSTED_EXECUTOR_SERVICE_ACCOUNT }}
          TRUSTED_EXECUTOR_WORKER_POOL: ${{ vars.GCP_CONSEQUENCE_CONTROL_TRUSTED_EXECUTOR_WORKER_POOL }}
          PROJECT_ID: ${{ vars.GCP_CONSEQUENCE_CONTROL_PROJECT }}
          REGION: ${{ vars.GCP_CONSEQUENCE_CONTROL_REGION }}
        run: |
          set -euo pipefail
          [[ "$APPROVED_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVED_ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_REQUEST_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]]
          [[ "$REGION" =~ ^[a-z]+(-[a-z0-9]+)+[0-9]$ ]]
          [[ "$REQUEST_BUCKET" =~ ^[a-z0-9][a-z0-9._-]{1,61}[a-z0-9]$ ]]
          [[ "$TRUSTED_EXECUTOR_IMAGE" =~ ^[a-z0-9.-]+/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$TRUSTED_EXECUTOR_SERVICE_ACCOUNT" =~ ^projects/([a-z][a-z0-9-]{4,28}[a-z0-9])/serviceAccounts/([a-z][a-z0-9-]{4,28}[a-z0-9])@([a-z][a-z0-9-]{4,28}[a-z0-9])\.iam\.gserviceaccount\.com$ ]] || {
            printf 'trusted executor service account must be a canonical Cloud Build resource\n' >&2
            exit 1
          }
          [[ "${BASH_REMATCH[1]}" == "$PROJECT_ID" ]] || {
            printf 'trusted executor service-account resource must belong to PROJECT_ID\n' >&2
            exit 1
          }
          [[ "${BASH_REMATCH[3]}" == "$PROJECT_ID" ]] || {
            printf 'trusted executor service-account email must belong to PROJECT_ID\n' >&2
            exit 1
          }
          [[ "$TRUSTED_EXECUTOR_WORKER_POOL" =~ ^projects/[a-z][a-z0-9-]{4,28}[a-z0-9]/locations/[a-z]+(-[a-z0-9]+)+[0-9]/workerPools/[a-z][a-z0-9-]{0,61}[a-z0-9]$ ]]
          case "$OPERATION" in
            deploy-candidates|bootstrap-stable|apply-decision-1|apply-decision-10|apply-decision-50|apply-decision-100|apply-actuator-100|apply-rollback)
              ;;
            *)
              exit 1
              ;;
          esac
          request_path="$RUNNER_TEMP/approved-request/deployment-request.tar.gz"
          request_uri="gs://$REQUEST_BUCKET/requests/$GITHUB_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.tar.gz"
          receipt_path="$RUNNER_TEMP/trusted-executor-receipt.json"
          roundtrip_path="$RUNNER_TEMP/roundtrip-request.tar.gz"
          build_config="$RUNNER_TEMP/trusted-executor-build.yaml"
          gcloud storage cp --no-clobber "$request_path" "$request_uri"
          gcloud storage cp "$request_uri" "$roundtrip_path"
          printf '%s  %s\n' "$EXPECTED_REQUEST_SHA256" "$roundtrip_path" | sha256sum --check --status
          # Cloud Build substitutions must remain literal in the generated config.
          # shellcheck disable=SC2016
          printf '%s\n' \
            'steps:' \
            '  - name: "${_EXECUTOR_IMAGE}"' \
            '    entrypoint: "/opt/emilia/bin/consequence-control-executor"' \
            '    args:' \
            '      - "--request-uri=${_REQUEST_URI}"' \
            '      - "--request-sha256=${_REQUEST_SHA256}"' \
            '      - "--operation=${_OPERATION}"' \
            '      - "--commit=${_COMMIT}"' \
            '      - "--artifact-id=${_ARTIFACT_ID}"' \
            '      - "--artifact-digest=${_ARTIFACT_DIGEST}"' \
            'serviceAccount: "${_SERVICE_ACCOUNT}"' \
            'options:' \
            '  logging: CLOUD_LOGGING_ONLY' \
            '  pool:' \
            '    name: "${_WORKER_POOL}"' > "$build_config"
          gcloud builds submit \
            --no-source \
            --config "$build_config" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --substitutions="_EXECUTOR_IMAGE=$TRUSTED_EXECUTOR_IMAGE,_REQUEST_URI=$request_uri,_REQUEST_SHA256=$EXPECTED_REQUEST_SHA256,_OPERATION=$OPERATION,_COMMIT=$GITHUB_SHA,_ARTIFACT_ID=$APPROVED_ARTIFACT_ID,_ARTIFACT_DIGEST=$APPROVED_ARTIFACT_DIGEST,_SERVICE_ACCOUNT=$TRUSTED_EXECUTOR_SERVICE_ACCOUNT,_WORKER_POOL=$TRUSTED_EXECUTOR_WORKER_POOL" \
            --format=json > "$receipt_path"

      - name: Preserve the trusted executor receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consequence-control-execution-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trusted-executor-receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
