name: Consequence Control Protected Deployment

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Protected candidate, bootstrap, promotion, or rollback operation
        required: true
        type: choice
        options:
          - deploy-candidates
          - bootstrap-stable
          - apply-decision-1
          - apply-decision-10
          - apply-decision-50
          - apply-decision-100
          - apply-actuator-100
          - apply-rollback
      bootstrap_id:
        description: Required short revision ID for bootstrap-stable
        required: false
        type: string
      placeholder_image:
        description: Required digest-pinned deny-all image for bootstrap-stable
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: consequence-control-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'emiliaprotocol/emilia-protocol' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: consequence-control-production
    env:
      EMILIA_DEPLOY_ENVIRONMENT: consequence-control-production
      EMILIA_GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
      EMILIA_DEPLOY_WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - name: Check out the exact protected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate keylessly as the protected deploy identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Install the pinned Google Cloud CLI action
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Materialize candidate-deploy coordinates
        if: inputs.operation == 'deploy-candidates'
        id: deploy-config
        shell: bash
        env:
          CONSEQUENCE_CONTROL_DEPLOY_CONFIG: ${{ secrets.CONSEQUENCE_CONTROL_DEPLOY_CONFIG }}
        run: |
          set -euo pipefail
          [[ -n "$CONSEQUENCE_CONTROL_DEPLOY_CONFIG" ]]
          config_path="$RUNNER_TEMP/consequence-control-deploy.env"
          umask 077
          printf '%s\n' "$CONSEQUENCE_CONTROL_DEPLOY_CONFIG" > "$config_path"
          printf 'path=%s\n' "$config_path" >> "$GITHUB_OUTPUT"

      - name: Materialize stable-bootstrap coordinates
        if: inputs.operation == 'bootstrap-stable'
        id: bootstrap-config
        shell: bash
        env:
          CONSEQUENCE_CONTROL_BOOTSTRAP_CONFIG: ${{ secrets.CONSEQUENCE_CONTROL_BOOTSTRAP_CONFIG }}
        run: |
          set -euo pipefail
          [[ -n "$CONSEQUENCE_CONTROL_BOOTSTRAP_CONFIG" ]]
          config_path="$RUNNER_TEMP/consequence-control-bootstrap.env"
          umask 077
          printf '%s\n' "$CONSEQUENCE_CONTROL_BOOTSTRAP_CONFIG" > "$config_path"
          printf 'path=%s\n' "$config_path" >> "$GITHUB_OUTPUT"

      - name: Materialize protected traffic decision
        if: startsWith(inputs.operation, 'apply-')
        id: traffic-inputs
        shell: bash
        env:
          TRAFFIC_OPERATION: ${{ inputs.operation }}
          CONSEQUENCE_CONTROL_TRAFFIC_CONFIG: ${{ secrets.CONSEQUENCE_CONTROL_TRAFFIC_CONFIG }}
          CONSEQUENCE_CONTROL_STABLE_MANIFEST: ${{ secrets.CONSEQUENCE_CONTROL_STABLE_MANIFEST }}
          CONSEQUENCE_CONTROL_ROLLOUT_AUTHORIZATION: ${{ secrets.CONSEQUENCE_CONTROL_ROLLOUT_AUTHORIZATION }}
          CONSEQUENCE_CONTROL_CANARY_EVIDENCE: ${{ secrets.CONSEQUENCE_CONTROL_CANARY_EVIDENCE }}
          CONSEQUENCE_CONTROL_ROLLOUT_TELEMETRY: ${{ secrets.CONSEQUENCE_CONTROL_ROLLOUT_TELEMETRY }}
          CONSEQUENCE_CONTROL_CANARY_EVIDENCE_PUBLIC_KEY: ${{ secrets.CONSEQUENCE_CONTROL_CANARY_EVIDENCE_PUBLIC_KEY }}
          CONSEQUENCE_CONTROL_ROLLOUT_TELEMETRY_PUBLIC_KEY: ${{ secrets.CONSEQUENCE_CONTROL_ROLLOUT_TELEMETRY_PUBLIC_KEY }}
          CONSEQUENCE_CONTROL_ROLLOUT_AUTHORIZATION_PUBLIC_KEY: ${{ secrets.CONSEQUENCE_CONTROL_ROLLOUT_AUTHORIZATION_PUBLIC_KEY }}
          CONSEQUENCE_CONTROL_STABLE_PUBLIC_KEY: ${{ secrets.CONSEQUENCE_CONTROL_STABLE_PUBLIC_KEY }}
          CONSEQUENCE_CONTROL_ROLLOUT_ATTEMPT_DATABASE_CA: ${{ secrets.CONSEQUENCE_CONTROL_ROLLOUT_ATTEMPT_DATABASE_CA }}
        run: |
          set -euo pipefail
          case "$TRAFFIC_OPERATION" in
            apply-decision-1|apply-decision-10|apply-decision-50|apply-decision-100|apply-actuator-100|apply-rollback)
              ;;
            *)
              printf 'unsupported protected traffic operation\n' >&2
              exit 1
              ;;
          esac
          [[ -n "$CONSEQUENCE_CONTROL_TRAFFIC_CONFIG" ]]
          [[ -n "$CONSEQUENCE_CONTROL_STABLE_MANIFEST" ]]
          [[ -n "$CONSEQUENCE_CONTROL_ROLLOUT_AUTHORIZATION" ]]
          [[ -n "$CONSEQUENCE_CONTROL_ROLLOUT_TELEMETRY_PUBLIC_KEY" ]]
          [[ -n "$CONSEQUENCE_CONTROL_ROLLOUT_AUTHORIZATION_PUBLIC_KEY" ]]
          [[ -n "$CONSEQUENCE_CONTROL_ROLLOUT_ATTEMPT_DATABASE_CA" ]]
          if [[ "$TRAFFIC_OPERATION" != apply-rollback ]]; then
            [[ -n "$CONSEQUENCE_CONTROL_CANARY_EVIDENCE" ]]
            [[ -n "$CONSEQUENCE_CONTROL_ROLLOUT_TELEMETRY" ]]
            [[ -n "$CONSEQUENCE_CONTROL_CANARY_EVIDENCE_PUBLIC_KEY" ]]
          fi
          config_path="$RUNNER_TEMP/consequence-control-traffic.env"
          manifest_path="$RUNNER_TEMP/consequence-control-stable.json"
          authorization_path="$RUNNER_TEMP/consequence-control-authorization.json"
          evidence_path="$RUNNER_TEMP/consequence-control-canary-evidence.json"
          telemetry_path="$RUNNER_TEMP/consequence-control-telemetry.json"
          trust_dir=/tmp/emilia-consequence-control-trust
          [[ ! -e "$trust_dir" ]]
          umask 077
          install -d -m 700 "$trust_dir"
          canary_key_path="$trust_dir/canary-evidence-public.pem"
          telemetry_key_path="$trust_dir/rollout-telemetry-public.pem"
          authorization_key_path="$trust_dir/rollout-authorization-public.pem"
          database_ca_path="$trust_dir/rollout-attempt-database-ca.pem"
          stable_key_path=
          printf '%s\n' "$CONSEQUENCE_CONTROL_TRAFFIC_CONFIG" > "$config_path"
          printf '%s\n' "$CONSEQUENCE_CONTROL_STABLE_MANIFEST" > "$manifest_path"
          printf '%s\n' "$CONSEQUENCE_CONTROL_ROLLOUT_AUTHORIZATION" > "$authorization_path"
          printf '%s\n' "$CONSEQUENCE_CONTROL_ROLLOUT_TELEMETRY_PUBLIC_KEY" > "$telemetry_key_path"
          printf '%s\n' "$CONSEQUENCE_CONTROL_ROLLOUT_AUTHORIZATION_PUBLIC_KEY" > "$authorization_key_path"
          printf '%s\n' "$CONSEQUENCE_CONTROL_ROLLOUT_ATTEMPT_DATABASE_CA" > "$database_ca_path"
          if [[ "$TRAFFIC_OPERATION" != apply-rollback ]]; then
            printf '%s\n' "$CONSEQUENCE_CONTROL_CANARY_EVIDENCE" > "$evidence_path"
            printf '%s\n' "$CONSEQUENCE_CONTROL_ROLLOUT_TELEMETRY" > "$telemetry_path"
            printf '%s\n' "$CONSEQUENCE_CONTROL_CANARY_EVIDENCE_PUBLIC_KEY" > "$canary_key_path"
          fi
          if [[ -n "$CONSEQUENCE_CONTROL_STABLE_PUBLIC_KEY" ]]; then
            stable_key_path="$trust_dir/stable-release-public.pem"
            printf '%s\n' "$CONSEQUENCE_CONTROL_STABLE_PUBLIC_KEY" > "$stable_key_path"
          fi
          {
            printf 'config_path=%s\n' "$config_path"
            printf 'manifest_path=%s\n' "$manifest_path"
            printf 'authorization_path=%s\n' "$authorization_path"
            printf 'evidence_path=%s\n' "$evidence_path"
            printf 'telemetry_path=%s\n' "$telemetry_path"
            printf 'stable_key_path=%s\n' "$stable_key_path"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy digest-pinned zero-traffic candidates
        if: inputs.operation == 'deploy-candidates'
        shell: bash
        env:
          DEPLOYMENT_APPROVED: "true"
          DEPLOYMENT_CONFIRM_PROJECT: ${{ vars.GCP_CONSEQUENCE_CONTROL_PROJECT }}
          DEPLOYMENT_CONFIG_SHA256: ${{ vars.CONSEQUENCE_CONTROL_DEPLOY_CONFIG_SHA256 }}
        run: |
          set -euo pipefail
          deploy/consequence-control-cloud-run/deploy.sh \
            --config "${{ steps.deploy-config.outputs.path }}" \
            --apply

      - name: Bootstrap digest-pinned deny-all stable revisions
        if: inputs.operation == 'bootstrap-stable'
        shell: bash
        env:
          DEPLOYMENT_APPROVED: "true"
          DEPLOYMENT_CONFIG_SHA256: ${{ vars.CONSEQUENCE_CONTROL_BOOTSTRAP_CONFIG_SHA256 }}
          BOOTSTRAP_ID: ${{ inputs.bootstrap_id }}
          PLACEHOLDER_IMAGE: ${{ inputs.placeholder_image }}
        run: |
          set -euo pipefail
          [[ "$BOOTSTRAP_ID" =~ ^[a-z][a-z0-9-]{0,20}$ ]]
          [[ "$PLACEHOLDER_IMAGE" =~ @sha256:[0-9a-f]{64}$ ]]
          deploy/consequence-control-cloud-run/bootstrap-stable.sh \
            --config "${{ steps.bootstrap-config.outputs.path }}" \
            --bootstrap-id "$BOOTSTRAP_ID" \
            --placeholder-image "$PLACEHOLDER_IMAGE" \
            --output "$RUNNER_TEMP/stable-release.json" \
            --apply

      - name: Apply one authorized traffic transition
        if: startsWith(inputs.operation, 'apply-')
        shell: bash
        env:
          TRAFFIC_OPERATION: ${{ inputs.operation }}
          DEPLOYMENT_APPROVED: "true"
          DEPLOYMENT_CONFIRM_PROJECT: ${{ vars.GCP_CONSEQUENCE_CONTROL_PROJECT }}
          DEPLOYMENT_CONFIG_SHA256: ${{ vars.CONSEQUENCE_CONTROL_TRAFFIC_CONFIG_SHA256 }}
          EMILIA_ROLLOUT_ATTEMPT_STORE_ADAPTER: ${{ github.workspace }}/deploy/consequence-control-cloud-run/postgres-rollout-attempt-store.sh
          EMILIA_ROLLOUT_ATTEMPT_STORE_ADAPTER_SHA256: ${{ vars.CONSEQUENCE_CONTROL_ATTEMPT_STORE_ADAPTER_SHA256 }}
          EMILIA_ROLLOUT_ATTEMPT_DATABASE_URL: ${{ secrets.CONSEQUENCE_CONTROL_ROLLOUT_ATTEMPT_DATABASE_URL }}
          EMILIA_ROLLOUT_ATTEMPT_DATABASE_CA_SHA256: ${{ vars.CONSEQUENCE_CONTROL_ROLLOUT_ATTEMPT_DATABASE_CA_SHA256 }}
        run: |
          set -euo pipefail
          case "$TRAFFIC_OPERATION" in
            apply-decision-1|apply-decision-10|apply-decision-50|apply-decision-100|apply-actuator-100|apply-rollback)
              ;;
            *)
              printf 'unsupported protected traffic operation\n' >&2
              exit 1
              ;;
          esac
          command -v psql >/dev/null
          psql --version
          traffic_args=(
            --config "${{ steps.traffic-inputs.outputs.config_path }}"
            --stable-manifest "${{ steps.traffic-inputs.outputs.manifest_path }}"
            --authorization "${{ steps.traffic-inputs.outputs.authorization_path }}"
            "--$TRAFFIC_OPERATION"
          )
          if [[ "$TRAFFIC_OPERATION" != apply-rollback ]]; then
            traffic_args+=(
              --evidence "${{ steps.traffic-inputs.outputs.evidence_path }}"
              --telemetry "${{ steps.traffic-inputs.outputs.telemetry_path }}"
            )
          fi
          stable_key_path="${{ steps.traffic-inputs.outputs.stable_key_path }}"
          if [[ -n "$stable_key_path" ]]; then
            traffic_args+=(--stable-public-key "$stable_key_path")
          fi
          deploy/consequence-control-cloud-run/traffic.sh "${traffic_args[@]}"

      - name: Preserve the signed stable bootstrap manifest
        if: inputs.operation == 'bootstrap-stable'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: consequence-control-stable-${{ inputs.bootstrap_id }}
          path: ${{ runner.temp }}/stable-release.json
          if-no-files-found: error
          retention-days: 30
