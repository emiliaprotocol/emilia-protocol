name: Evidence autopilot publish

# Pushes the bundle produced by evidence-autopilot.yml back to its pull
# request branch as one commit that changes only derived evidence.
#
# workflow_run always executes this file and scripts/ci/evidence-autopilot.mjs
# from the default branch, never from the pull request. The pull request
# checkout is data: nothing in it is installed, built or executed. The bundle
# is untrusted until `inspect` re-validates every byte against the allowlist
# and the exact source commit, and the push is a fast-forward onto that
# commit only, so a branch that moved in the meantime is left alone (the
# autopilot runs again for the new head).
#
# A push made with GITHUB_TOKEN does not start new workflow runs, which would
# leave every required check pending on the evidence commit. The push
# therefore uses a GitHub App installation token. Required, not provisioned
# as of 2026-09-25 (see the pull request that added this file):
#   EVIDENCE_AUTOPILOT_CLIENT_ID    GitHub App client ID
#   EVIDENCE_AUTOPILOT_PRIVATE_KEY  GitHub App private key (PEM)
# The App needs only Contents: read and write on this repository, must not
# hold the Workflows permission, and must not be on any bypass list. Add both
# values as Actions secrets and as Dependabot secrets with the same names, so
# runs that originate from Dependabot resolve them too.

on:
  workflow_run:
    workflows: [Evidence autopilot]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: evidence-autopilot-publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check out trusted default-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: trusted
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Find the evidence bundle and its open pull request
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::malformed head sha"; exit 1; }
          [[ "$HEAD_BRANCH" =~ ^[A-Za-z0-9._/-]+$ && "$HEAD_BRANCH" != -* && "$HEAD_BRANCH" != main ]] || {
            echo "::error::refusing head branch '$HEAD_BRANCH'"
            exit 1
          }
          artifacts=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name == "evidence-autopilot" and (.expired | not))] | length')
          if [[ "$artifacts" != 1 ]]; then
            echo "::notice::No evidence bundle in run $RUN_ID (the autopilot did not run for this head)."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pull=$(gh api "repos/$REPOSITORY/commits/$SOURCE_SHA/pulls" \
            --jq "[.[] | select(.state == \"open\" and .head.sha == \"$SOURCE_SHA\" and .head.ref == \"$HEAD_BRANCH\" and .head.repo.full_name == \"$REPOSITORY\")] | first | .number // empty")
          if [[ -z "$pull" ]]; then
            echo "::notice::No open same-repository pull request still has head $SOURCE_SHA; nothing to publish."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "pull=$pull" >> "$GITHUB_OUTPUT"

      - name: Download the untrusted bundle
        if: steps.locate.outputs.found == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evidence-autopilot
          path: bundle
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Validate the bundle with trusted code
        id: inspect
        if: steps.locate.outputs.found == 'true'
        run: >-
          node trusted/scripts/ci/evidence-autopilot.mjs inspect
          --bundle bundle
          --source-sha "$SOURCE_SHA"
          --github-output "$GITHUB_OUTPUT"

      - name: Require the evidence autopilot app credentials
        if: steps.inspect.outputs.changed == 'true'
        env:
          CLIENT_ID_SET: ${{ secrets.EVIDENCE_AUTOPILOT_CLIENT_ID != '' }}
          PRIVATE_KEY_SET: ${{ secrets.EVIDENCE_AUTOPILOT_PRIVATE_KEY != '' }}
          PULL: ${{ steps.locate.outputs.pull }}
        run: |
          if [[ "$CLIENT_ID_SET" != true || "$PRIVATE_KEY_SET" != true ]]; then
            echo "::error title=Evidence autopilot is not provisioned::Regenerated evidence for #$PULL is ready in run $RUN_ID (artifact evidence-autopilot), but it cannot be pushed: EVIDENCE_AUTOPILOT_CLIENT_ID and EVIDENCE_AUTOPILOT_PRIVATE_KEY are not set. Create a GitHub App with Contents read/write only, install it on $REPOSITORY, and add both values as Actions and Dependabot secrets. A GITHUB_TOKEN push would not start the required checks."
            exit 1
          fi

      - name: Mint a repository-scoped App token
        id: app-token
        if: steps.inspect.outputs.changed == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.EVIDENCE_AUTOPILOT_CLIENT_ID }}
          private-key: ${{ secrets.EVIDENCE_AUTOPILOT_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Check out the pull request branch as data
        if: steps.inspect.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          path: pr
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      # No DCO sign-off: a bot cannot certify origin. dco.yml exempts exactly
      # this shape (App bot identity, autopilot trailer, single parent,
      # derived-evidence paths only), as it exempts Dependabot's commits.
      - name: Apply, commit and push the regenerated evidence
        if: steps.inspect.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if [[ "$(git -C pr rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
            echo "::notice::$HEAD_BRANCH moved past $SOURCE_SHA; the autopilot will run again for the new head."
            exit 0
          fi
          node trusted/scripts/ci/evidence-autopilot.mjs apply \
            --bundle bundle --source-sha "$SOURCE_SHA" --repo pr
          bot_id=$(gh api "users/${APP_SLUG}[bot]" --jq .id)
          author="${APP_SLUG}[bot]"
          email="${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git -C pr config user.name "$author"
          git -C pr config user.email "$email"
          git -C pr add -- \
            formal/results/formal-runtime-scenario-conformance.v2.json \
            conformance/conformance-manifest.json \
            security/security-case.json \
            lib/proof-stats.json \
            AI_CONTEXT.md \
            public/llms.txt \
            public/llms-full.txt \
            public/.well-known/emilia-context.json
          git -C pr commit --quiet --file - <<EOF
          chore(evidence): regenerate derived evidence for ${SOURCE_SHA:0:12}

          Regenerated from ${SOURCE_SHA} by the evidence autopilot with the
          official writers (sync:formal-traces, conformance:manifest,
          sync:proof-stats, sync:llm-context). The required checks re-verify
          every file on this commit.

          Evidence-Autopilot: v1
          Evidence-Autopilot-Run: ${RUN_URL}
          EOF
          git -C pr push origin "HEAD:refs/heads/${HEAD_BRANCH}"
