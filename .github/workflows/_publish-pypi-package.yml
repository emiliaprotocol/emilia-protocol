name: Reusable verified PyPI release

permissions: read-all

on:
  workflow_call:
    inputs:
      package_dir:
        required: true
        type: string
      package_name:
        required: true
        type: string
      artifact_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      confirmation:
        required: true
        type: string
      tag_prefix:
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: registry-publishing-approval
    env:
      TLA2TOOLS_JAR: ${{ github.workspace }}/tla2tools.jar
    concurrency:
      group: registry-publish-pypi-${{ inputs.package_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Setup Java for the pinned formal-methods oracle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Download the pinned TLA+ model checker
        env:
          TLA_VERSION: v1.7.4
          TLA_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          curl --fail --location --silent --show-error \
            -o tla2tools.jar \
            "https://github.com/tlaplus/tlaplus/releases/download/${TLA_VERSION}/tla2tools.jar"
          echo "${TLA_SHA256}  tla2tools.jar" | sha256sum -c -

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"

      - name: Install hash-locked build and test tooling
        run: python -m pip install --require-hashes -r .github/workflow-requirements/release.txt

      - name: Install locked repository tooling
        run: npm ci --ignore-scripts

      - name: Test package
        working-directory: ${{ inputs.package_dir }}
        env:
          PYTHONPATH: ${{ github.workspace }}/${{ inputs.package_dir }}:${{ github.workspace }}/${{ inputs.package_dir }}/src
        run: python -m pytest -q

      - name: Require owner approval bound to tag, package, version, and main
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
          PACKAGE_NAME: ${{ inputs.package_name }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          VERSION=$(python -c "import tomllib,os; print(tomllib.load(open(os.path.join(os.environ['PACKAGE_DIR'],'pyproject.toml'),'rb'))['project']['version'])")
          node scripts/require-release-approval.mjs \
            --allowed-actor FutureEnterprises \
            --tag "$RELEASE_TAG" \
            --tag-prefix "$TAG_PREFIX" \
            --package "$PACKAGE_NAME" \
            --version "$VERSION" \
            --confirmation "$RELEASE_CONFIRMATION"

      - name: Execute security and conformance evidence
        run: |
          npm run security-case:emit
          npm run conformance:manifest

      - name: Build twice and retain exact reproducible artifacts
        id: build
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          node scripts/verify-reproducible-wheel.mjs "$PACKAGE_DIR" \
            --emit "release-artifacts/${ARTIFACT_ID}-reproducible.json" \
            --outdir release-artifacts
          OUTPUT_DIR="release-artifacts/$(basename "$PACKAGE_DIR")"
          WHEEL=$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.whl' -print -quit)
          SDIST=$(find "$OUTPUT_DIR" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$WHEEL" && test -n "$SDIST"
          echo "wheel=$WHEEL" >> "$GITHUB_OUTPUT"
          echo "sdist=$SDIST" >> "$GITHUB_OUTPUT"
          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Check exact distributions
        run: python -m twine check "${{ steps.build.outputs.wheel }}" "${{ steps.build.outputs.sdist }}"

      - name: Attest exact wheel
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.wheel }}

      - name: Attest exact source distribution
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.build.outputs.sdist }}

      - name: Attest conformance and security manifests
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            security/security-case.json
            conformance/conformance-manifest.json
            release-artifacts/${{ inputs.artifact_id }}-reproducible.json

      - name: Upload exact release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_id }}-release-${{ inputs.release_tag }}
          path: |
            ${{ steps.build.outputs.output_dir }}/
            release-artifacts/${{ inputs.artifact_id }}-reproducible.json
            security/security-case.json
            conformance/conformance-manifest.json
          retention-days: 90

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: ${{ steps.build.outputs.output_dir }}/
          skip-existing: true

      - name: Verify PyPI bytes match the attested artifacts
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          PACKAGE_DIR: ${{ inputs.package_dir }}
        run: |
          VERSION=$(python -c "import tomllib,os; print(tomllib.load(open(os.path.join(os.environ['PACKAGE_DIR'],'pyproject.toml'),'rb'))['project']['version'])")
          mkdir -p registry-copy
          for attempt in {1..36}; do
            if python -m pip download --no-cache-dir --no-deps --only-binary=:all: --dest registry-copy "${PACKAGE_NAME}==${VERSION}" \
              && python -m pip download --no-cache-dir --no-deps --no-binary=:all: --no-build-isolation --dest registry-copy "${PACKAGE_NAME}==${VERSION}"; then
              break
            fi
            sleep 5
          done
          REGISTRY_WHEEL=$(find registry-copy -maxdepth 1 -name '*.whl' -print -quit)
          REGISTRY_SDIST=$(find registry-copy -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "$REGISTRY_WHEEL" && test -n "$REGISTRY_SDIST"
          cmp "${{ steps.build.outputs.wheel }}" "$REGISTRY_WHEEL"
          cmp "${{ steps.build.outputs.sdist }}" "$REGISTRY_SDIST"
