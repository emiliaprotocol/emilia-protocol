name: schema-security

# Release-blocker invariant: prod schema truth comes from executable contracts
# (objects that ACTUALLY exist with the expected shape), NOT the migration
# journal. Runs the schema-security contract + the journal-vs-reality
# reconciliation against the live database.
#
# Secret policy:
#   - pull_request_target: the workflow and executable reconciliation code come
#     only from the trusted base commit. Candidate SQL/ledger bytes are data.
#   - merge_group: only candidate-reconciliation runs (trusted base code
#     parsing candidate bytes as data, no secret). GitHub reads this workflow
#     file from the merge-queue candidate, so the secret-using live leg never
#     runs on merge_group; push and the nightly run cover it with base code.
#   - push to main / nightly schedule: secrets are REQUIRED; their absence or any
#     drift FAILS the workflow.
#
# Required secret, held by the `schema-gate` environment (Settings →
# Environments → schema-gate → Environment secrets), not as a repository
# secret:
#   SCHEMA_GATE_DB_URL — pooler connection string for the separately provisioned
#   `schema_gate_ci_gha` login, inheriting the NOLOGIN `schema_gate_ci` group.
#   The group has two explicit schema-introspection EXECUTE grants, but also
#   inherits any function grants to PUBLIC. Audit effective function access
#   before activating the login; see docs/operations/SCHEMA-GATE-CI.md. The
#   god-mode service-role key is NOT in CI.
# Restrict the environment's deployment branches to main. push, schedule,
# workflow_dispatch on main and pull_request_target all run on refs/heads/main
# and are admitted; a workflow running on any other ref (including a
# merge-queue ref, refs/heads/gh-readonly-queue/main/...) is refused. Until the
# environment exists GitHub creates it on first use with no restriction, and a
# copy of the secret left at repository level stays readable by candidate
# workflow files on merge_group, so moving it is a manual settings step.
#
# To make this a true deploy gate: require the unique
# `emilia-production-schema-contract-v2` GitHub check on main and configure the
# external Vercel deployment check documented in docs/operations/DEPLOYMENT.md.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
  # Merge-queue candidates run only candidate-reconciliation: candidate
  # migration bytes parsed as data by base-commit code, with no secret.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 7 * * *'   # nightly 07:17 UTC drift sweep
  workflow_dispatch:

concurrency:
  group: schema-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-reconciliation:
    if: github.event_name == 'pull_request_target' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted base reconciliation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted-base

      - name: Check out candidate migration bytes as data only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 1
          persist-credentials: false
          # This is the narrow pull_request_target exception the checkout action
          # requires. The sparse tree is never executed: trusted base code parses
          # only the migration ledger and SQL after rejecting unsafe file types.
          allow-unsafe-pr-checkout: true
          path: candidate-data
          sparse-checkout: |
            supabase/migrations
            supabase/migration-history.v1.json
            supabase/migration-archive/2026-07-25-history-reconciliation
          sparse-checkout-cone-mode: false

      - name: Parse candidate ledger and SQL only with trusted base code
        run: |
          node trusted-base/scripts/schema-pr-candidate-reconcile.mjs \
            --base-root trusted-base \
            --candidate-root candidate-data

  live-schema-contract:
    # Never on merge_group: that run reads this file from the candidate.
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    # The schema-gate credential lives in this environment, whose deployment
    # branches must be restricted to main (see the header).
    environment: schema-gate
    steps:
      - name: Check out only the trusted live-contract implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: trusted

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          # Node 24: @supabase/supabase-js needs native WebSocket (absent in Node 20).
          node-version: 24
          cache: npm
          cache-dependency-path: trusted/package-lock.json

      - name: Install trusted schema-gate dependencies
        working-directory: trusted
        run: npm ci --ignore-scripts

      - name: Secret guard (skip neutrally on fork PRs; required on main/schedule)
        id: guard
        env:
          SCHEMA_GATE_DB_URL: ${{ secrets.SCHEMA_GATE_DB_URL }}
        run: |
          if [ -n "$SCHEMA_GATE_DB_URL" ]; then
            echo "have_secrets=true" >> "$GITHUB_OUTPUT"
            echo "schema CI credential present — running schema truth checks."
          else
            echo "have_secrets=false" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "pull_request_target" ]; then
              echo "::notice::SCHEMA_GATE_DB_URL unavailable (fork PR or unset) — skipping schema-security neutrally."
            else
              echo "::error::SCHEMA_GATE_DB_URL is REQUIRED on '${{ github.event_name }}' but is missing. Prod schema truth cannot be verified — failing."
              exit 1
            fi
          fi

      - name: schema:security — contract vs live prod (tables, columns, RLS, no-anon policies, RPC ACLs, indexes, authority shape)
        if: steps.guard.outputs.have_secrets == 'true'
        working-directory: trusted
        env:
          SCHEMA_GATE_DB_URL: ${{ secrets.SCHEMA_GATE_DB_URL }}
        run: npm run schema:security

      - name: schema:reconcile — migration journal vs reality (declared objects must actually exist)
        if: steps.guard.outputs.have_secrets == 'true'
        working-directory: trusted
        env:
          SCHEMA_GATE_DB_URL: ${{ secrets.SCHEMA_GATE_DB_URL }}
        run: npm run schema:reconcile

  schema-contract:
    name: emilia-production-schema-contract-v2
    if: always()
    needs: [candidate-reconciliation, live-schema-contract]
    runs-on: ubuntu-latest
    steps:
      - name: Require candidate reconciliation when applicable and live schema truth
        env:
          EVENT_NAME: ${{ github.event_name }}
          CANDIDATE_RESULT: ${{ needs.candidate-reconciliation.result }}
          LIVE_RESULT: ${{ needs.live-schema-contract.result }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == merge_group ]]; then
            # The live leg is excluded on merge_group (candidate workflow
            # file); push to main runs it with base code after the merge.
            [[ "$LIVE_RESULT" == skipped ]] || {
              echo "::error::live schema contract must not run on merge_group: $LIVE_RESULT"
              exit 1
            }
          else
            [[ "$LIVE_RESULT" == success ]] || {
              echo "::error::live schema contract did not succeed: $LIVE_RESULT"
              exit 1
            }
          fi
          if [[ "$EVENT_NAME" == pull_request_target || "$EVENT_NAME" == merge_group ]]; then
            [[ "$CANDIDATE_RESULT" == success ]] || {
              echo "::error::candidate reconciliation did not succeed: $CANDIDATE_RESULT"
              exit 1
            }
          else
            [[ "$CANDIDATE_RESULT" == skipped ]] || {
              echo "::error::candidate reconciliation must be skipped outside pull requests: $CANDIDATE_RESULT"
              exit 1
            }
          fi
          echo '"emilia-production-schema-contract-v2" is satisfied.'
