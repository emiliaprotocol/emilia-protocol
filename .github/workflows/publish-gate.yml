name: Publish Gate

# npm trusted publisher identity remains this caller workflow:
# @emilia-protocol/gate -> publish-gate.yml, protected by the
# registry-publishing-approval environment inside the reusable publisher job.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact tag, for example gate-v0.16.0
        required: true
        type: string
      confirmation:
        description: Type PUBLISH @emilia-protocol/gate@<version>
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/_publish-npm-package.yml
    with:
      package_dir: packages/gate
      package_name: '@emilia-protocol/gate'
      artifact_id: gate
      release_tag: ${{ inputs.release_tag }}
      confirmation: ${{ inputs.confirmation }}
      tag_prefix: gate-v
