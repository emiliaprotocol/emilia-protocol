name: Release Provenance

# Opt every JavaScript-based action into the Node.js 24 runner.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_REF: ${{ inputs.release_ref || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact immutable annotated release tag, for example gate-v0.16.0
        required: true
        type: string
  release:
    types: [published]
  push:
    tags:
      - '*-v*'

# The build job is deliberately unprivileged. OIDC and attestation authority exist
# only in the inert protected job that consumes one immutable artifact ID.
permissions: {}

jobs:
  build:
    name: Build release evidence from protected main
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require an annotated release tag at the exact protected main tip
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_REF" =~ ^[a-z0-9][a-z0-9._-]*-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release provenance requires one canonical *-vSEMVER tag."
            exit 2
          fi
          git fetch --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main" \
            "+refs/tags/$RELEASE_REF:refs/tags/$RELEASE_REF"
          TAG_OBJECT=$(git rev-parse "refs/tags/$RELEASE_REF")
          test "$(git cat-file -t "$TAG_OBJECT")" = tag
          TAG_COMMIT=$(git rev-parse "$TAG_OBJECT^{commit}")
          HEAD_COMMIT=$(git rev-parse HEAD)
          MAIN_COMMIT=$(git rev-parse refs/remotes/origin/main)
          test "$TAG_COMMIT" = "$HEAD_COMMIT"
          test "$TAG_COMMIT" = "$MAIN_COMMIT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.22'

      - name: Install hash-locked cross-language verifier dependency
        run: python -m pip install --require-hashes -r .github/workflow-requirements/cryptography.txt

      - name: Install hash-locked npm release tooling
        run: |
          npm ci --prefix .github/npm-toolchain --ignore-scripts --min-release-age=0
          echo "$GITHUB_WORKSPACE/.github/npm-toolchain/node_modules/.bin" >> "$GITHUB_PATH"

      - run: npm ci --ignore-scripts

      - name: Verify exact security case
        run: npm run security-case:emit

      - name: Resolve exact conformance manifest
        run: npm run conformance:manifest

      - name: Verify reproducible package bytes
        run: npm run release:verify:reproducible

      - name: Pack verify SDK release artifact
        run: |
          set -euo pipefail
          mkdir -p release-evidence/release-artifacts
          npm pack ./packages/verify --json --pack-destination release-evidence/release-artifacts \
            > release-evidence/release-artifacts/pack.json
          TARBALL=$(node -e "const r=require('./release-evidence/release-artifacts/pack.json'); if(r.length!==1) process.exit(2); process.stdout.write(r[0].filename)")
          mv "release-evidence/release-artifacts/$TARBALL" \
            release-evidence/release-artifacts/verify-package.tgz
          sha256sum release-evidence/release-artifacts/verify-package.tgz \
            > release-evidence/release-artifacts/verify-package.tgz.sha256
          rm release-evidence/release-artifacts/pack.json

      - name: Generate release SBOM
        run: npm sbom --sbom-format=cyclonedx --omit=dev > release-evidence/sbom.json

      - name: Copy machine-verifiable evidence
        run: |
          cp security/security-case.json release-evidence/security-case.json
          cp conformance/conformance-manifest.json release-evidence/conformance-manifest.json

      - name: Generate MCP server SBOM
        working-directory: mcp-server
        run: |
          npm ci --ignore-scripts
          npm sbom --sbom-format=cyclonedx --omit=dev > ../release-evidence/mcp-server-sbom.json

      - name: Upload one immutable release-evidence input
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-evidence-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 90

  attest:
    name: Attest immutable release evidence
    needs: build
    runs-on: ubuntu-latest
    environment: registry-publishing-approval
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the exact unprivileged build artifact
        uses: actions/download-artifact@59252a704fd6b981032c03f21d7f3f06d0559800  # v8.0.0
        with:
          artifact-ids: ${{ needs.build.outputs.release_artifact_id }}
          path: release-evidence

      - name: Validate inert release-evidence inventory
        shell: bash
        run: |
          set -euo pipefail
          test -f release-evidence/release-artifacts/verify-package.tgz
          test -f release-evidence/release-artifacts/verify-package.tgz.sha256
          test -f release-evidence/security-case.json
          test -f release-evidence/conformance-manifest.json
          test -f release-evidence/sbom.json
          test -f release-evidence/mcp-server-sbom.json
          test "$(find release-evidence -type l -print -quit)" = ""
          test "$(find release-evidence -type f | wc -l | tr -d ' ')" = 6
          (cd release-evidence/release-artifacts && sha256sum -c verify-package.tgz.sha256)

      - name: Attest verify SDK package bytes
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # v4.2.0
        with:
          subject-path: release-evidence/release-artifacts/verify-package.tgz

      - name: Attest machine-verifiable security case
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # v4.2.0
        with:
          subject-path: release-evidence/security-case.json

      - name: Attest machine-verifiable conformance manifest
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6  # v4.2.0
        with:
          subject-path: release-evidence/conformance-manifest.json
