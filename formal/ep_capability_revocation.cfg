\* BCR-03 revocation-inheritance model configuration.
\* Three capability atoms exercise a root, child, and grandchild.  Two
\* operation atoms permit reservation before and after a revocation race.

CONSTANTS
    RootCap = cap_root
    ChildCap = cap_child
    GrandchildCap = cap_grandchild
    Operations = {op_a, op_b}
    MaxSteps = 7

SPECIFICATION Spec

CONSTRAINT BoundedExploration

INVARIANT TypeInvariant
INVARIANT RegistrationOrder
INVARIANT OwnedOperationSound
INVARIANT CascadeRevocationClosesDescendants
INVARIANT DirectRevocationDoesNotRetractTransferredAuthority
INVARIANT MissingLineageFailsClosed

PROPERTY ModeImmutable
PROPERTY RevocationIrreversible
PROPERTY OwnedReservationNeverReopens
PROPERTY NewReservationRequiresCurrentCompleteLineage
PROPERTY NewChildRequiresActiveParentLineage
