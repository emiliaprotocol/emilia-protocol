\* Shared TLC configuration for the safe EP-BOUNDED-EXECUTION-PROGRAM-v1
\* model and its unsigned-supersession and authorization-fence controls.

CONSTANTS
    POriginal = pOriginal
    PSignedSuccessor = pSignedSuccessor
    PUnsignedSuccessor = pUnsignedSuccessor
    NInspect = nInspect
    NRemediate = nRemediate
    NVerify = nVerify
    Attempts = attempts
    RiskPoints = riskPoints
    Occurrence1 = occurrence1
    Occurrence2 = occurrence2
    Occurrence3 = occurrence3
    Occurrence4 = occurrence4
    TenantA = tenantA
    ExpiryA = expiryA
    ExpiryB = expiryB
    AuthorizationDigestA = authorizationDigestA
    NoProgram = noProgram
    NoNode = noNode
    NoBinding = noBinding

SPECIFICATION Spec
CHECK_DEADLOCK FALSE

INVARIANT TypeInvariant
INVARIANT ClosedDAG
INVARIANT SingleActiveHead
\* The unsafe module MUST falsify this load-bearing authenticity invariant.
INVARIANT OnlySignedProgramsCanBeActive
INVARIANT AuthorizationFenceConsistent
INVARIANT OrdinaryReservationBlocksProgramRegistration
INVARIANT FencedAuthorizationBlocksOrdinaryReserve
INVARIANT SupersessionChainValid
INVARIANT UnregisteredProgramsAreFresh
INVARIANT OccurrenceBindingsComplete
INVARIANT ProgramAdmissionBindingExact
INVARIANT OccurrenceCeilingsHold
INVARIANT TotalOccurrencesBounded
INVARIANT AdmissionExpiryWithinProgramExpiry
INVARIANT BudgetConservation
INVARIANT BudgetAccountingExact
INVARIANT AdmittedNodesHaveTerminalDependencies
INVARIANT IndeterminateNeverSatisfiesDependency
INVARIANT SupersededProgramsHaveNoReservedWork
INVARIANT UnavailableProgramsHaveNoReservedWork

PROPERTY ReserveChargesEveryDimension
PROPERTY BeginConsumesEveryDimension
PROPERTY ReleaseRestoresEveryDimension
PROPERTY ConsumedBudgetNeverRefunds
PROPERTY ClosedOccurrencesNeverReopen
PROPERTY AdmissionBindingNeverRelinks
PROPERTY BeginRequiresAvailableProgram
PROPERTY DeactivationReleasesPreEntryPreservesPostEntry
PROPERTY ProgramExpiryDoesNotStrandReservations
PROPERTY ProgramRegistrationFencesAuthorizationAtomically
PROPERTY SignedSupersessionStartsFresh
