[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "emilia-protocol"
version = "0.11.0"
description = "Synchronous, zero-dependency client for EMILIA handshakes, trust gate, and v1 trust receipts."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = []
keywords = ["trust", "ai-agents", "emilia-protocol", "handshake", "trust-receipt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://emiliaprotocol.ai"
Repository = "https://github.com/emiliaprotocol/emilia-protocol"
Documentation = "https://emiliaprotocol.ai/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/emilia_protocol"]
