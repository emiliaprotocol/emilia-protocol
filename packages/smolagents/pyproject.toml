[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "emilia-smolagents"
version = "0.1.1"
description = "Exact-action authorization receipt checks for Hugging Face smolagents tools."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Iman Schrock", email = "team@emiliaprotocol.ai" }]
dependencies = [
  "smolagents>=1.26.0,<1.27",
  "emilia-crewai>=0.3.5,<0.4",
  "emilia-verify>=2.8.5,<3",
]

[project.optional-dependencies]
test = ["pytest>=7", "cryptography>=41"]

[project.urls]
Repository = "https://github.com/emiliaprotocol/emilia-protocol"

[tool.hatch.build.targets.wheel]
packages = ["emilia_smolagents"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.pytest.ini_options]
testpaths = ["tests"]
